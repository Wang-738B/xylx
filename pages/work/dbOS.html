<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>豆包 OS</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="%234da3ff"/><stop offset="1" stop-color="%238b7aff"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(%23g)"/><text x="32" y="44" font-size="34" text-anchor="middle" fill="white" font-family="sans-serif" font-weight="700">豆</text></svg>'>
<style>
/* ================= 基础 & 变量 ================= */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --accent:77,165,255;          /* 主强调色 RGB */
  --accent2:139,122,255;        /* 渐变副色 */
  --accent-solid:rgb(var(--accent));
  --radius:10px;
  --tb-h:48px;
  --title-h:38px;
  --ease:cubic-bezier(.22,1,.36,1);
  --ease-bounce:cubic-bezier(.34,1.56,.64,1);
  --ease-snap:cubic-bezier(.2,.8,.2,1);
  --font:"Segoe UI Variable","Segoe UI","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --mono:"Cascadia Mono",Consolas,"JetBrains Mono","SF Mono",monospace;
}
html[data-theme="dark"]{
  --bg:14,16,20;
  --surface:rgba(28,31,39,.72);
  --surface-solid:rgb(32,35,44);
  --surface2:rgba(45,49,60,.88);
  --surface3:rgba(255,255,255,.07);
  --text:#eef1f6;
  --text-dim:rgba(238,241,246,.6);
  --text-faint:rgba(238,241,246,.38);
  --border:rgba(255,255,255,.09);
  --border-strong:rgba(255,255,255,.16);
  --shadow:0 24px 60px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.35);
  --shadow-sm:0 8px 24px rgba(0,0,0,.35);
  --icon-shadow:drop-shadow(0 2px 3px rgba(0,0,0,.45));
  color-scheme:dark;
}
html[data-theme="light"]{
  --bg:229,233,240;
  --surface:rgba(255,255,255,.78);
  --surface-solid:rgb(250,251,253);
  --surface2:rgba(255,255,255,.92);
  --surface3:rgba(0,0,0,.05);
  --text:#1b212b;
  --text-dim:rgba(27,33,43,.62);
  --text-faint:rgba(27,33,43,.4);
  --border:rgba(0,0,0,.08);
  --border-strong:rgba(0,0,0,.14);
  --shadow:0 24px 60px rgba(30,40,70,.22),0 6px 18px rgba(30,40,70,.12);
  --shadow-sm:0 8px 24px rgba(30,40,70,.16);
  --icon-shadow:drop-shadow(0 2px 2px rgba(30,40,70,.35));
  color-scheme:light;
}
html,body{height:100%;overflow:hidden;font-family:var(--font);font-size:14px;color:var(--text);-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(128,134,148,.45);border-radius:9px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(128,134,148,.7);border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}
:focus-visible{outline:2px solid var(--accent-solid);outline-offset:2px}
svg{display:block}
[hidden]{display:none!important}

/* ================= 开机引导 ================= */
#boot{position:fixed;inset:0;z-index:1000;background:#05060a;display:flex;align-items:center;justify-content:center;overflow:hidden}
#boot .boot-logo{display:flex;flex-direction:column;align-items:center;gap:26px;opacity:0;transform:scale(.92);animation:bootLogo .8s var(--ease) .2s forwards}
@keyframes bootLogo{to{opacity:1;transform:scale(1)}}
#boot .logo-mark{width:84px;height:84px;border-radius:22px;background:linear-gradient(135deg,#4da3ff,#8b7aff);display:flex;align-items:center;justify-content:center;box-shadow:0 0 70px rgba(77,163,255,.45),0 0 18px rgba(139,122,255,.35);animation:logoPulse 2.4s ease-in-out infinite}
@keyframes logoPulse{0%,100%{box-shadow:0 0 70px rgba(77,163,255,.45),0 0 18px rgba(139,122,255,.35)}50%{box-shadow:0 0 95px rgba(77,163,255,.7),0 0 30px rgba(139,122,255,.55)}}
#boot .logo-mark span{color:#fff;font-size:46px;font-weight:800;letter-spacing:2px}
#boot .boot-name{color:#fff;font-size:22px;font-weight:600;letter-spacing:6px}
#boot .boot-sub{color:rgba(255,255,255,.45);font-size:12px;letter-spacing:2px}
#boot .boot-bar{width:240px;height:3px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
#boot .boot-bar i{display:block;height:100%;width:0%;border-radius:3px;background:linear-gradient(90deg,#4da3ff,#8b7aff);transition:width .3s var(--ease)}
#boot .boot-tip{color:rgba(255,255,255,.28);font-size:11px;position:absolute;bottom:34px;letter-spacing:1px}
#boot.fade-out{opacity:0;transition:opacity .55s ease}
#boot .dots{display:flex;gap:7px;height:26px;align-items:flex-end;opacity:.9}
#boot .dots i{width:7px;height:7px;border-radius:50%;background:#4da3ff;animation:dotUp 1s ease-in-out infinite}
#boot .dots i:nth-child(2){animation-delay:.15s;background:#6b9dff}
#boot .dots i:nth-child(3){animation-delay:.3s;background:#8b7aff}
@keyframes dotUp{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-9px);opacity:1}}

/* ================= 登录界面 ================= */
#login{position:fixed;inset:0;z-index:900;overflow:hidden;transition:opacity .5s ease}
#login .lg-wall{position:absolute;inset:-6%;background-size:cover;background-position:center;filter:blur(4px) saturate(1.05) brightness(.9);animation:kenBurns 24s ease-in-out infinite alternate}
@keyframes kenBurns{from{transform:scale(1)}to{transform:scale(1.06)}}
#login .lg-shade{position:absolute;inset:0;background:rgba(0,0,0,.28)}
#login .lg-card{position:absolute;left:50%;top:50%;transform:translate(-50%,-46%);display:flex;flex-direction:column;align-items:center;gap:18px;width:min(360px,88vw)}
#login .lg-ava{width:92px;height:92px;border-radius:50%;background:var(--surface-solid);border:3px solid rgba(255,255,255,.85);box-shadow:0 10px 30px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;overflow:hidden;opacity:0;transform:scale(.7) translateY(18px);animation:lgUp .7s var(--ease-bounce) .1s forwards}
@keyframes lgUp{to{opacity:1;transform:scale(1) translateY(0)}}
#login .lg-ava svg{width:64px;height:64px}
#login .lg-name{color:#fff;font-size:21px;font-weight:600;letter-spacing:2px;text-shadow:0 2px 12px rgba(0,0,0,.5);opacity:0;animation:lgUp .6s var(--ease) .25s forwards}
#login .lg-pwd-wrap{width:100%;opacity:0;animation:lgUp .6s var(--ease) .38s forwards}
#login .lg-pwd{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:0 16px;height:52px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:border-color .2s,background .2s}
#login .lg-pwd:focus-within{border-color:rgba(255,255,255,.65);background:rgba(255,255,255,.2)}
#login .lg-pwd svg{width:20px;height:20px;color:rgba(255,255,255,.85);flex:none}
#login .lg-pwd input{flex:1;height:100%;background:none;border:none;outline:none;color:#fff;font-size:16px;letter-spacing:2px}
#login .lg-pwd input::placeholder{color:rgba(255,255,255,.55);letter-spacing:0;font-size:14px}
#login .lg-go{width:36px;height:36px;flex:none;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;color:#fff;transition:background .2s,transform .2s}
#login .lg-go:hover{background:rgba(255,255,255,.38);transform:scale(1.06)}
#login .lg-go svg{width:17px;height:17px}
#login .lg-shake{animation:shake .45s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
#login .lg-hint{color:rgba(255,255,255,.55);font-size:12px;opacity:0;animation:lgUp .6s var(--ease) .5s forwards}
#login .lg-hint b{color:rgba(255,255,255,.85);font-weight:500}
#login .lg-loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:18px;opacity:0;pointer-events:none;transition:opacity .3s}
#login .lg-loading.on{opacity:1}
#login .lg-loading .ring{width:52px;height:52px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#login .lg-loading span{color:#fff;font-size:14px;letter-spacing:3px;text-shadow:0 2px 10px rgba(0,0,0,.6)}
#login .lg-pwr{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);display:flex;gap:14px;opacity:0;animation:lgUp .6s var(--ease) .6s forwards}
#login .lg-pwr button{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);color:#fff;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .2s;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#login .lg-pwr button:hover{background:rgba(255,255,255,.3);transform:translateY(-2px)}
#login .lg-pwr svg{width:19px;height:19px}
#login.hide{opacity:0;pointer-events:none}

/* ================= 桌面 ================= */
#os{position:fixed;inset:0;opacity:0;pointer-events:none;transition:opacity .5s ease}
#os.on{opacity:1;pointer-events:auto}
#wallpaper{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity .8s ease;z-index:0}
.wp-aurora{background:linear-gradient(150deg,#0a1e3c 0%,#123c66 30%,#1b5f8a 55%,#2a7f9e 75%,#144e70 100%)}
.wp-sunset{background:linear-gradient(165deg,#2b1a4e 0%,#6d2b63 35%,#c2526e 65%,#e8925c 85%,#f4c477 100%)}
.wp-forest{background:linear-gradient(160deg,#0e2b1d 0%,#1d4f33 40%,#2e7d4f 70%,#3f9d63 100%)}
.wp-ocean{background:linear-gradient(150deg,#072a4d 0%,#0d4a78 40%,#1a7fa8 70%,#2bb3cf 100%)}
.wp-sand{background:linear-gradient(170deg,#3a2b20 0%,#7a5030 45%,#c98a4b 75%,#efc07e 100%)}
.wp-midnight{background:linear-gradient(150deg,#05070d 0%,#0c1226 45%,#182044 80%,#101736 100%)}
.wp-dynamic{animation:wpDrift 26s ease-in-out infinite alternate}
@keyframes wpDrift{from{filter:hue-rotate(0deg) brightness(1)}to{filter:hue-rotate(28deg) brightness(1.08)}}
#deskIcons{position:absolute;top:10px;left:10px;height:calc(100% - var(--tb-h) - 26px);display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:2px;z-index:2}
.di{width:86px;padding:9px 4px 7px;border-radius:9px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:default;user-select:none;border:1px solid transparent;transition:background .15s,border-color .15s;animation:diIn .45s var(--ease) backwards}
@keyframes diIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.di:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.12)}
.di.sel{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.22);outline:1px solid rgba(var(--accent),.5)}
.di .di-ic{width:46px;height:46px;display:flex;align-items:center;justify-content:center;filter:var(--icon-shadow);transition:transform .18s var(--ease-bounce)}
.di:hover .di-ic{transform:scale(1.08)}
.di .di-ic svg{width:44px;height:44px}
.di .di-lb{color:#fff;font-size:12px;line-height:1.25;text-align:center;text-shadow:0 1px 4px rgba(0,0,0,.7),0 0 8px rgba(0,0,0,.35);max-width:80px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.di.pulse{animation:diPulse .5s ease}
@keyframes diPulse{0%{transform:scale(1)}35%{transform:scale(.92)}70%{transform:scale(1.06)}100%{transform:scale(1)}}

/* 桌面小组件 */
#widgets{position:absolute;top:14px;right:14px;z-index:2;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.wg-card{background:rgba(20,22,28,.42);border:1px solid rgba(255,255,255,.1);border-radius:14px;backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);color:#fff;box-shadow:0 8px 28px rgba(0,0,0,.25);overflow:hidden}
.wg-clock{width:228px;padding:14px 16px 12px;display:flex;align-items:center;gap:14px}
.wg-clock .analog{width:58px;height:58px;flex:none}
.wg-clock .digit{font-size:26px;font-weight:600;letter-spacing:.5px;line-height:1.05;font-variant-numeric:tabular-nums}
.wg-clock .date{font-size:12.5px;color:rgba(255,255,255,.72);margin-top:3px}
.wg-cal{width:228px;padding:12px 14px 14px}
.wg-cal .cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px;font-weight:600}
.wg-cal .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:11.5px}
.wg-cal .cal-grid b{color:rgba(255,255,255,.45);font-weight:500;padding:3px 0}
.wg-cal .cal-grid span{padding:3px 0;border-radius:6px;color:rgba(255,255,255,.85)}
.wg-cal .cal-grid span.today{background:rgb(var(--accent));color:#fff;font-weight:700}
.wg-cal .cal-grid span.mut{color:rgba(255,255,255,.3)}
.wg-greet{background:linear-gradient(120deg,rgba(77,163,255,.32),rgba(139,122,255,.32));padding:10px 16px;font-size:13px;letter-spacing:.5px;border-color:rgba(255,255,255,.16)}

/* ================= 窗口 ================= */
#windows{position:fixed;inset:0;z-index:10;pointer-events:none}
.win{position:absolute;min-width:280px;min-height:180px;background:var(--surface-solid);border:1px solid var(--border-strong);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;pointer-events:auto;animation:winOpen .3s var(--ease)}
@keyframes winOpen{from{opacity:0;transform:scale(.86) translateY(22px)}to{opacity:1;transform:scale(1) translateY(0)}}
.win.closing{animation:winClose .24s var(--ease) forwards;pointer-events:none}
@keyframes winClose{to{opacity:0;transform:scale(.88) translateY(16px)}}
.win.mining{animation:winMin .28s var(--ease) forwards;pointer-events:none}
@keyframes winMin{to{opacity:0;transform:scale(.5) translateY(65vh)}}
.win.restoring{animation:winRestore .28s var(--ease)}
@keyframes winRestore{from{opacity:0;transform:scale(.5) translateY(65vh)}to{opacity:1;transform:scale(1) translateY(0)}}
.win.maxed{border-radius:0;border:none}
.win.maxed .win-resize{display:none}
.win.blur{opacity:.86;box-shadow:0 10px 30px rgba(0,0,0,.28)}
.win-title{height:var(--title-h);flex:none;display:flex;align-items:center;gap:8px;padding-left:12px;background:var(--surface);backdrop-filter:blur(22px) saturate(1.35);-webkit-backdrop-filter:blur(22px) saturate(1.35);border-bottom:1px solid var(--border);user-select:none;cursor:default;touch-action:none}
.win.maxed .win-title{border-radius:0}
.win-title .w-ic{width:17px;height:17px;color:var(--text);flex:none}
.win-title .w-ic svg{width:17px;height:17px}
.win-title .w-name{font-size:12.5px;color:var(--text);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win.blur .win-title .w-name{color:var(--text-dim)}
.win-ctl{display:flex;height:100%;margin-left:auto}
.win-ctl button{width:46px;height:100%;display:flex;align-items:center;justify-content:center;color:var(--text-dim);transition:background .14s,color .14s;position:relative}
.win-ctl button svg{width:12px;height:12px}
.win-ctl button:hover{background:var(--surface3);color:var(--text)}
.win-ctl .w-close:hover{background:#e81123;color:#fff}
.win-body{flex:1;overflow:auto;position:relative;display:flex;flex-direction:column;background:var(--surface-solid)}
.win-resize{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;z-index:5}
.win-resize::after{content:"";position:absolute;right:3px;bottom:3px;width:8px;height:8px;border-right:2px solid var(--text-faint);border-bottom:2px solid var(--text-faint);border-radius:0 0 3px 0;opacity:.6}

/* ================= 任务栏 ================= */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--tb-h);z-index:50;display:flex;align-items:center;padding:0 8px;background:var(--surface);backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);border-top:1px solid var(--border)}
.tb-left{display:flex;align-items:center;gap:2px;flex:1;min-width:0;overflow:hidden}
.tb-center{display:flex;align-items:center;gap:2px;position:absolute;left:50%;transform:translateX(-50%)}
.tb-right{display:flex;align-items:center;gap:2px;margin-left:auto}
.tb-btn{width:40px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text);position:relative;transition:background .15s,transform .12s;flex:none}
.tb-btn:hover{background:var(--surface3)}
.tb-btn:active{transform:scale(.9)}
.tb-btn svg{width:20px;height:20px}
.tb-btn .tb-ic{width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.tb-btn .tb-ic svg{width:22px;height:22px}
.tb-btn.active{background:var(--surface3)}
.tb-btn.active::after{content:"";position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--accent-solid)}
.tb-sep{width:1px;height:22px;background:var(--border);margin:0 6px;flex:none}
#tbClock{display:flex;flex-direction:column;align-items:flex-end;padding:0 10px;border-radius:8px;height:38px;justify-content:center;line-height:1.25;font-size:12px;color:var(--text);transition:background .15s;cursor:default}
#tbClock:hover{background:var(--surface3)}
#tbClock .t{font-variant-numeric:tabular-nums;font-weight:600}
#tbClock .d{font-size:11px;color:var(--text-dim)}
.tb-tooltip{position:fixed;z-index:300;background:var(--surface2);border:1px solid var(--border-strong);color:var(--text);font-size:12px;padding:5px 10px;border-radius:7px;box-shadow:var(--shadow-sm);pointer-events:none;opacity:0;transform:translate(-50%,4px);transition:opacity .15s,transform .15s;white-space:nowrap}
.tb-tooltip.show{opacity:1;transform:translate(-50%,0)}

/* ================= 开始菜单 ================= */
#startMenu{position:fixed;left:50%;bottom:calc(var(--tb-h) + 10px);transform:translateX(-50%);width:min(600px,94vw);max-height:min(660px,80vh);background:var(--surface);border:1px solid var(--border-strong);border-radius:16px;backdrop-filter:blur(30px) saturate(1.5);-webkit-backdrop-filter:blur(30px) saturate(1.5);box-shadow:var(--shadow);z-index:60;display:flex;flex-direction:column;overflow:hidden;opacity:0;transform-origin:50% 100%;pointer-events:none;transition:opacity .22s var(--ease),transform .22s var(--ease)}
#startMenu.open{opacity:1;transform:translateX(-50%) scale(1);pointer-events:auto}
#startMenu.closed{transform:translateX(-50%) scale(.92) translateY(14px)}
.sm-search{margin:16px 16px 6px;display:flex;align-items:center;gap:9px;background:var(--surface3);border:1px solid var(--border);border-radius:9px;padding:0 12px;height:38px;flex:none;transition:border-color .2s}
.sm-search:focus-within{border-color:rgba(var(--accent),.65)}
.sm-search svg{width:15px;height:15px;color:var(--text-dim);flex:none}
.sm-search input{flex:1;background:none;border:none;outline:none;font-size:13px;height:100%}
.sm-search input::placeholder{color:var(--text-faint)}
.sm-grid{flex:1;overflow:auto;padding:10px 16px 14px;display:grid;grid-template-columns:repeat(6,1fr);gap:2px;align-content:start}
.sm-item{display:flex;flex-direction:column;align-items:center;gap:7px;padding:11px 4px 9px;border-radius:9px;transition:background .15s;animation:smIn .35s var(--ease) backwards;border:1px solid transparent}
.sm-item:hover{background:var(--surface3);border-color:var(--border)}
.sm-item .sm-ic{width:38px;height:38px;display:flex;align-items:center;justify-content:center;filter:var(--icon-shadow)}
.sm-item .sm-ic svg{width:36px;height:36px}
.sm-item .sm-lb{font-size:11.5px;color:var(--text);line-height:1.2;text-align:center}
@keyframes smIn{from{opacity:0;transform:translateY(10px) scale(.92)}to{opacity:1;transform:translateY(0) scale(1)}}
.sm-user{display:flex;align-items:center;gap:10px;padding:12px 18px;border-top:1px solid var(--border);flex:none}
.sm-user .u-ava{width:32px;height:32px;border-radius:50%;overflow:hidden;background:var(--surface3);display:flex;align-items:center;justify-content:center}
.sm-user .u-ava svg{width:24px;height:24px}
.sm-user .u-name{font-size:13px;flex:1;font-weight:500}
.sm-user button{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-dim);transition:background .15s,color .15s}
.sm-user button:hover{background:var(--surface3);color:var(--text)}
.sm-user button svg{width:17px;height:17px}

/* ================= 右键菜单 ================= */

/* ---------- 声音系统（WebAudio 合成，默认关闭） ---------- */
const SFX=(()=>{
  let ctx=null,enabled=false,vol=0.4;
  function ac(){if(!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return ctx}
  function tone(f0,f1,dur,type,delay,gain){
    if(!enabled)return;const c=ac();if(!c)return;
    const t=c.currentTime+(delay||0);
    const o=c.createOscillator(),g=c.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain||0.12,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.02);
  }
  function noise(dur,delay){
    if(!enabled)return;const c=ac();if(!c)return;
    const t=c.currentTime+(delay||0);const b=c.createBuffer(1,c.sampleRate*dur,c.sampleRate);
    const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.5;
    const s=c.createBufferSource();s.buffer=b;const g=c.createGain();
    g.gain.setValueAtTime(0.09,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(g);g.connect(c.destination);s.start(t);
  }
  return{
    enable(on){enabled=on;if(on&&ctx&&ctx.state==='suspended')ctx.resume()},
    setVol(v){vol=v;if(ctx)ctx.resume()},
    click(){tone(1800,1400,0.05,'triangle',0,0.045);noise(0.03,0)},
    open(){tone(520,760,0.09,'sine',0,0.08);tone(780,1040,0.1,'sine',0.03,0.05)},
    close(){tone(640,380,0.1,'sine',0,0.07)},
    success(){tone(660,880,0.09,'sine',0,0.07);tone(880,1320,0.12,'sine',0.08,0.06)},
    error(){tone(300,180,0.16,'sawtooth',0,0.07)},
    boot(){tone(392,392,0.14,'sine',0,0.08);tone(523,523,0.14,'sine',0.13,0.08);tone(659,659,0.2,'sine',0.26,0.09)},
    shutdown(){tone(523,392,0.16,'sine',0,0.07);tone(392,262,0.24,'sine',0.15,0.07)}
  };
})();

/* ---------- 工具函数 ---------- */
function toast(msg,type,icon){
  const box=$('#toasts');const t=document.createElement('div');
  t.className='toast '+(type||'info');
  const ic=icon||(type==='ok'?'check':type==='warn'?'fire':'info');
  t.innerHTML=monoIcon(ic,17)+`<span>${msg}</span>`;
  box.appendChild(t);SFX.click();
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),320)},2600);
}
function pad(n){return n<10?'0'+n:''+n}
function todayStr(d){return `${d.getMonth()+1}月${d.getDate()}日 星期${'日一二三四五六'[d.getDay()]}`}
function nowHM(d){return pad(d.getHours())+':'+pad(d.getMinutes())}
function greeting(){const h=new Date().getHours();return h<6?'夜深了':h<9?'早上好':h<12?'上午好':h<14?'中午好':h<18?'下午好':'晚上好'}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

  const hg=(d.getHours()%12)*30+d.getMinutes()*0.5,mg=d.getMinutes()*6+d.getSeconds()*0.1,sg=d.getSeconds()*6;
  $('#gHour').setAttribute('transform',`rotate(${hg} 30 30)`);
  $('#gMin').setAttribute('transform',`rotate(${mg} 30 30)`);
  $('#gSec').setAttribute('transform',`rotate(${sg} 30 30)`);

function buildCal(){
  const d=new Date(),y=d.getFullYear(),m=d.getMonth();
  const first=new Date(y,m,1),start=first.getDay(),days=new Date(y,m+1,0).getDate();
  const wd=['日','一','二','三','四','五','六'];
  let h=`<div class="cal-head"><span>${y}年${m+1}月</span><span>${wd[d.getDay()]}</span></div><div class="cal-grid">`;
  wd.forEach(w=>h+=`<b>${w}</b>`);
  for(let i=0;i<start;i++)h+='<span class="mut"></span>';
  for(let i=1;i<=days;i++){const t=new Date(y,m,i);h+=`<span class="${i===d.getDate()?'today':((t.getDay()===0||t.getDay()===6)?'mut':'')}">${i}</span>`}
  $('#wgCal').innerHTML=h+'</div>';
}

   窗口管理器
   ================================================================ */
const W={list:[],z:50,idc:0};
const WIN_DEF={
  explorer:{w:880,h:560},notepad:{w:660,h:480},calc:{w:340,h:530},browser:{w:920,h:620},
  terminal:{w:740,h:460},settings:{w:880,h:560},cleaner:{w:560,h:540},snake:{w:500,h:600},
  recycle:{w:660,h:460}
};
function createWin(id,title,bodyHtml,opts={}){
  const def=WIN_DEF[id]||{w:640,h:460};
  const vw=innerWidth,vh=innerHeight;
  let w=opts.w||Math.min(def.w,vw-24),h=opts.h||Math.min(def.h,vh-56);
  w=Math.min(w,vw-16);h=Math.min(h,vh-58);
  const cascade=W.list.length%7;
  let x=Math.max(10,(vw-w)/2+(cascade-3)*28),y=Math.max(6,(vh-56-h)/2+(cascade-3)*22);
  x=Math.max(10,Math.min(x,vw-w-8));y=Math.max(6,Math.min(y,vh-58-h));
  const el=document.createElement('div');
  el.className='win';
  el.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px;z-index:${++state.winZ}`;
  el.innerHTML=`
    <div class="win-title">
      <span class="w-ic">${colorIcon(id,17)}</span>
      <span class="w-name">${esc(title)}</span>
      <div class="win-ctl">
        <button class="w-min" title="最小化">${monoIcon('min',12)}</button>
        <button class="w-max" title="最大化">${monoIcon('max',12)}</button>
        <button class="w-close" title="关闭">${monoIcon('x',12)}</button>
      </div>
    </div>
    <div class="win-body">${bodyHtml}</div>
    <div class="win-resize"></div>`;
  $('#windows').appendChild(el);
  const win={el,app:id,name:title,min:false,max:false,dying:false,state:{}};
  W.list.push(win);
  SFX.open();
  /* 事件绑定 */
  el.addEventListener('pointerdown',()=>W.focus(win));
  el.querySelector('.w-min').addEventListener('click',e=>{e.stopPropagation();W.min(win)});
  el.querySelector('.w-max').addEventListener('click',e=>{e.stopPropagation();W.toggleMax(win)});
  el.querySelector('.w-close').addEventListener('click',e=>{e.stopPropagation();W.close(win)});
  const tbar=el.querySelector('.win-title');
  tbar.addEventListener('dblclick',e=>{if(!e.target.closest('.win-ctl'))W.toggleMax(win)});
  tbar.addEventListener('pointerdown',e=>{
    if(e.target.closest('.win-ctl')||win.max||win.dying)return;
    W.focus(win);
    const r=el.getBoundingClientRect(),ox=e.clientX-r.left,oy=e.clientY-r.top;
    let moved=false;
    const mv=ev=>{
      const nx=Math.max(40-r.width,Math.min(ev.clientX-ox,innerWidth-90));
      const ny=Math.max(0,Math.min(ev.clientY-oy,innerHeight-56-6));
      el.style.left=nx+'px';el.style.top=ny+'px';moved=true;
    };
    const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up)};
    addEventListener('pointermove',mv);addEventListener('pointerup',up);
  });
  const rz=el.querySelector('.win-resize');
  rz.addEventListener('pointerdown',e=>{
    e.stopPropagation();W.focus(win);
    const r=el.getBoundingClientRect();
    const mv=ev=>{
      let nw=ev.clientX-r.left,nh=ev.clientY-r.top;
      nw=Math.max((def.minW||280),Math.min(nw,innerWidth-r.left-4));
      nh=Math.max((def.minH||180),Math.min(nh,innerHeight-56-r.top-4));
      el.style.width=nw+'px';el.style.height=nh+'px';
    };
    const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up)};
    addEventListener('pointermove',mv);addEventListener('pointerup',up);
  });
  W.focus(win);
  updateTaskbar();
  return win;
}
W.focus=function(win){
  state.winZ++;win.el.style.zIndex=state.winZ;
  W.list.forEach(o=>o.el.classList.toggle('blur',o!==win));
  updateTaskbar();
};
W.min=function(win){
  if(win.max||win.dying)return;
  win.min=true;win.el.classList.add('mining');updateTaskbar();
  setTimeout(()=>{win.el.style.display='none';win.el.classList.remove('mining')},275);
};
W.restore=function(win){
  if(!win.min)return;
  win.min=false;win.el.style.display='flex';
  win.el.classList.add('restoring');
  setTimeout(()=>win.el.classList.remove('restoring'),280);
  W.focus(win);
};
W.toggleMax=function(win){
  if(win.dying)return;
  if(win.max){
    win.max=false;win.el.classList.remove('maxed');
    Object.assign(win.el.style,{left:win.prev.x+'px',top:win.prev.y+'px',width:win.prev.w+'px',height:win.prev.h+'px'});
    win.el.querySelector('.w-max').innerHTML=monoIcon('max',12);
  }else{
    win.prev={x:win.el.style.left,y:win.el.style.top,w:win.el.style.width,h:win.el.style.height};
    win.max=true;win.el.classList.add('maxed');
    win.el.style.left='0px';win.el.style.top='0px';win.el.style.width='100vw';win.el.style.height='calc(100vh - '+56+'px)';
    win.el.querySelector('.w-max').innerHTML=monoIcon('restore',12);
  }
  W.focus(win);
};
W.close=function(win){
  if(win.dying)return;
  win.dying=true;win.el.classList.add('closing');SFX.close();
  const onExit=()=>{try{win.onClose&&win.onClose()}catch(e){}};
  setTimeout(()=>{onExit();win.el.remove();W.list=W.list.filter(o=>o!==win);updateTaskbar()},230);
};
W.closeAll=function(instant){
  W.list.slice().forEach(w=>{
    if(instant){w.el.remove();W.list=W.list.filter(o=>o!==w)}
    else W.close(w);
  });
  updateTaskbar();
};
W.bring=function(win){W.restore(win)};

/* ---------- 任务栏 ---------- */
const PINNED=['explorer','notepad','browser','calc','terminal','settings'];
function updateTaskbar(){
  const box=$('#tbPinned');box.innerHTML='';
  const items=[...PINNED];
  W.list.forEach(w=>{if(!items.includes(w.app))items.push(w.app)});
  items.forEach(id=>{
    const b=document.createElement('button');
    b.className='tb-btn';b.title=APPS[id]?APPS[id].name:id;
    b.innerHTML=`<span class="tb-ic">${colorIcon(id,22)}</span>`;
    const run=W.list.filter(w=>w.app===id&&!w.dying);
    if(run.length)b.classList.add('active');
    b.addEventListener('click',()=>{
      if(!run.length){openApp(id);return}
      const top=run.find(w=>!w.el.classList.contains('blur')&&!w.min)||run[0];
      if(top&&!top.min&&!top.el.classList.contains('blur'))W.min(top);
      else{W.restore(top);W.focus(top)}
    });
    b.addEventListener('pointerenter',()=>tooltip(b,b.title));
    b.addEventListener('pointerleave',hideTooltip);
    box.appendChild(b);
  });
}
function tooltip(el,text){
  const t=$('#tbTooltip')||Object.assign(document.createElement('div'),{id:'tbTooltip',className:'tb-tooltip'});
  if(!t.isConnected)document.body.appendChild(t);
  t.textContent=text;t.classList.add('show');
  const r=el.getBoundingClientRect();
  t.style.left=(r.left+r.width/2)+'px';t.style.top=(r.top-8)+'px';
}
function hideTooltip(){$('#tbTooltip')?.classList.remove('show')}

function resolvePath(path){
  let node=FS;
  for(const seg of path){
    const kids=node===FS?node:node.children;
    if(!kids||kids[seg]===undefined)return null;
    node=kids[seg];
  }
  return node;
}

APP_BUILD.explorer=function(opts={}){

    }
    function driveCard(node){

  }};

APP_BUILD.calc=function(){
  const html=`
    <div class="calc">
      <div class="calc-disp"><div class="calc-expr" id="clExpr"></div><div class="calc-num" id="clNum">0</div></div>
      <div class="calc-keys">
        <button class="fn" data-k="C">C</button><button class="fn" data-k="±">±</button><button class="fn" data-k="%">%</button><button class="op" data-k="÷">÷</button>
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button class="op" data-k="×">×</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button class="op" data-k="-">−</button>
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button class="op" data-k="+">+</button>
        <button data-k="0" style="grid-column:span 2">0</button><button data-k=".">.</button><button class="eq" data-k="=">=</button>
      </div>
    </div>`;
  return {title:'计算器',html,onMount(win){
    const el=win.el,expr=el.querySelector('#clExpr'),num=el.querySelector('#clNum');
    let cur='0',prev=null,op=null,wait=false,justEq=false;
    const fmt=x=>{const s=parseFloat(x).toPrecision(12);return (parseFloat(s)+'').replace(/\.0+$/,'')};
    const draw=()=>{num.textContent=cur;expr.textContent=prev!==null?`${fmt(prev)} ${op||''}`:''};
    el.querySelectorAll('.calc-keys button').forEach(b=>b.addEventListener('click',()=>{
      const k=b.dataset.k;SFX.click();
      if(/\d/.test(k)){if(wait||cur==='0'&&k!=='.'){cur=k;wait=false}else cur=cur==='0'?k:cur+k}
      else if(k==='.'){if(!cur.includes('.'))cur+=k}
      else if(k==='C'){cur='0';prev=null;op=null;wait=false}
      else if(k==='±'){cur=(parseFloat(cur)*-1)+''}
      else if(k==='%'){cur=fmt(parseFloat(cur)/100)}
      else if('+-×÷'.includes(k)){
        if(op&&!wait){cur=fmt(calc(parseFloat(prev),parseFloat(cur),op))}
        prev=parseFloat(cur);op=k;wait=true;
      }
      else if(k==='='){
        if(op===null)return;
        cur=fmt(calc(parseFloat(prev),parseFloat(cur),op));
        prev=null;op=null;wait=false;
      }
      draw();
    }));
    function calc(a,b,o){if(o==='+')return a+b;if(o==='-')return a-b;if(o==='×')return a*b;if(o==='÷')return b===0?(toast('除数不能为 0','warn','x'),0):a/b;return b}
    el.addEventListener('keydown',e=>{
      const map={'+':'+','-':'-','*':'×','/':'÷','Enter':'=','Backspace':'C','%':'%','.':'.'};
      if(/\d/.test(e.key)){el.querySelector(`[data-k="${e.key}"]`)?.click()}
      else if(map[e.key]){el.querySelector(`[data-k="${map[e.key]}"]`)?.click();e.preventDefault()}
    });
  }};
};

APP_BUILD.browser=function(opts={}){
  const html=`
    <div class="browser">
      <div class="br-nav">
        <div class="nav-btns">
          <button id="brBack" disabled title="后退">${monoIcon('back',15)}</button>
          <button id="brFwd" disabled title="前进">${monoIcon('fwd',15)}</button>
          <button id="brHome" title="主页">${monoIcon('home',15)}</button>
          <button id="brReload" title="刷新">${monoIcon('refresh',15)}</button>
        </div>
        <div class="br-addr">${monoIcon('shield',14)}<input id="brAddr" spellcheck="false" placeholder="输入网址或搜索内容"></div>
      </div>
      <div class="br-view" id="brView"></div>
    </div>`;
  return {title:'浏览器',html,onMount(win){
    const view=win.el.querySelector('#brView'),addr=win.el.querySelector('#brAddr');
    const hist=[],st={hist:[],idx:-1};
    function go(page,url){
      st.hist=st.hist.slice(0,st.idx+1);st.hist.push({page,url});st.idx++;
      render();
    }
    function render(){
      const cur=st.hist[st.idx]||{page:'home',url:'home'};
      view.innerHTML=cur.page==='home'?brHome():cur.page==='search'?brSearch(cur.q):(BR_PAGES[cur.page]?BR_PAGES[cur.page](cur.q):BR_PAGES['404'](cur.url));
      addr.value=cur.url;
      win.el.querySelector('#brBack').disabled=st.idx<=0;
      win.el.querySelector('#brFwd').disabled=st.idx>=st.hist.length-1;
      view.scrollTop=0;
      view.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));
      const f=view.querySelector('#brSearchForm');
      if(f)f.addEventListener('submit',e=>{e.preventDefault();const q=win.el.querySelector('#brQ').value.trim()||'豆包 OS';go('search',q)});
    }
    function brHome(){
      return `
        <div class="br-topbar"><h1>豆搜</h1><p>搜你所想，想你所搜（并不）</p></div>
        <div class="br-searchbar"><form id="brSearchForm">
          <input id="brQ" placeholder="搜索「豆包 OS」或随便什么…">
          <button type="submit">搜索</button>
        </form></div>
        <div class="br-sites">
          ${[['豆包百科','wiki','豆'],['豆包天气','weather','气'],['豆包日报','news','报'],['豆包 OS 官网','about','OS']].map(([l,p,ic])=>`<div class="br-site" data-go="${p}"><div class="bs-ic" style="background:linear-gradient(135deg,#4da3ff,#8b7aff)">${ic}</div><div class="bs-lb">${l}</div><div class="bs-ur">${p}.doubao.example</div></div>`).join('')}
        </div>
        <div class="br-footer">豆包浏览器 · 内置 4 个网站，够用一辈子</div>`;
    }
    win.el.querySelector('#brBack').addEventListener('click',()=>{if(st.idx>0){st.idx--;render()}});
    win.el.querySelector('#brFwd').addEventListener('click',()=>{if(st.idx<st.hist.length-1){st.idx++;render()}});
    win.el.querySelector('#brHome').addEventListener('click',()=>go('home','home'));
    win.el.querySelector('#brReload').addEventListener('click',()=>render());
    addr.addEventListener('keydown',e=>{
      if(e.key!=='Enter')return;
      const v=addr.value.trim().toLowerCase();
      if(BR_PAGES[v])go(v,v);
      else if(v.startsWith('http'))go('404',v);
      else if(v)go('search',v);
    });
    go('home','home');
  }};
};

/* ---------- 打开应用（分发） ---------- */
function openApp(id,opts={}){
  const b=APP_BUILD[id];if(!b)return null;
  const build=typeof b==='function'?b:b.build;
  const single=['settings','recycle','cleaner','snake'].includes(id);
  if(single){
    const ex=W.list.find(w=>w.app===id&&!w.dying);
    if(ex){W.restore(ex);W.focus(ex);if(b.goto)b.goto(ex,opts);return ex}
  }
  const r=build(opts);
  const win=createWin(id,r.title,r.html,r.def||{});
  win.onClose=()=>{r.onClose&&r.onClose(win)};
  if(b.goto)b.goto(win,opts);
  r.onMount&&r.onMount(win);
  return win;
}

const BOOT_TIME=Date.now();
const TERM_DIRS=['桌面','文档','图片','下载','音乐'];
APP_BUILD.terminal=function(){
  const html=`
    <div class="term">
      <div class="term-out" id="tOut"></div>
      <div class="term-in"><span class="t-prompt">guest@豆包OS:~$</span><input id="tIn" autocomplete="off" spellcheck="false"></div>
    </div>`;
  return {title:'终端',html,onMount(win){
    const out=win.el.querySelector('#tOut'),inp=win.el.querySelector('#tIn');
    let cwd='~';
    function print(html,cls){out.insertAdjacentHTML('beforeend',`<div class="${cls||''}">${html}</div>`);out.scrollTop=out.scrollHeight}
    function banner(){
      print('豆包 OS 终端 v1.0','t-dim');
      print('输入 <span class="t-ok">help</span> 查看可用命令。','t-dim');
      print('');
    }
    function neofetch(){
      print(`<span class="t-ok">    ██████████</span>   <b>guest@豆包OS</b>`);
      print(`<span class="t-ok">    ██ ██ ██ ██</span>   ------------------`);
      print(`<span class="t-ok">    ██ ██ ██ ██</span>   OS: 豆包OS 25H2 x64`);
      print(`<span class="t-ok">    ██████████</span>   Kernel: 6.6.6-doubao`);
      print(`<span class="t-ok">    ██ ██ ██ ██</span>   Uptime: ${Math.floor((Date.now()-BOOT_TIME)/60000)} 分钟`);
      print(`<span class="t-ok">    ██████████</span>   Shell: fake-sh 1.0`);
      print(`<span class="t-ok">              </span>   CPU: 心情处理器 2.0 GHz`);
      print(`<span class="t-ok">              </span>   GPU: 想象力加速卡`);
      print(`<span class="t-ok">              </span>   Memory: 16 GB（其中 15.9 GB 是氛围感）`);
      print('');
    }
    function help(){
      const cmds=[['help','显示帮助'],['ls','列出目录'],['cd','切换目录'],['pwd','当前路径'],['cat','查看文件'],['open','打开应用'],['neofetch','系统信息'],['date','当前时间'],['echo','回显'],['whoami','我是谁'],['ver','版本信息'],['df','磁盘使用'],['uptime','开机时长'],['sudo','尝试获得权限'],['rm','删除文件'],['lock','锁定系统'],['shutdown','关机'],['reboot','重启'],['clear','清屏']];
      cmds.forEach(([c,d])=>print(`<span class="t-ok">${c.padEnd(9)}</span><span class="t-dim">${d}</span>`));
      print('');
    }
    function run(cmdline){
      const [cmd,...args]=cmdline.trim().split(/\s+/);
      const arg=args.join(' ');
      switch(cmd){
        case '':break;
        case 'help':help();break;
        case 'clear':case 'cls':out.innerHTML='';break;
        case 'ls':print(TERM_DIRS.map(d=>`<span class="t-ok">${d}/</span>`).join('   ')+'    <span class="t-dim">说明.txt</span>');break;
        case 'pwd':print('/home/guest'+(cwd==='~'?'':'/'+cwd));break;
        case 'cd':{
          const t=arg||'~';
          if(t==='~')cwd='~';
          else if(t==='..')cwd='~';
          else if(TERM_DIRS.includes(t))cwd=t;
          else print(`cd: 没有那个目录：${t}（它只存在于你的想象里）`,'t-err');
          break}
        case 'cat':{
          if(arg==='说明.txt')print('欢迎来到豆包 OS。\n这个系统是假的，快乐是真的。\n—— 豆包 OS 团队','t-dim');
          else if(arg==='使用指南.txt')print('双击打开应用 / 拖动标题栏移动窗口 / 右键桌面有惊喜 / 终端里输入 sudo 试试。');
          else print(`cat: ${arg||'?'}: 文件不存在（或者存在，但我们的内存不够让它存在）`,'t-err');
          break}
        case 'open':{
          const map={'explorer':'文件管理器','notepad':'记事本','calc':'计算器','browser':'浏览器','terminal':'终端','settings':'设置','cleaner':'清理大师','snake':'贪吃蛇'};
          const a=map[arg];
          if(a){print(`正在打开 ${a} …`);openApp(arg)}
          else print(`open: 未知应用「${arg||''}」。试试 explorer / notepad / calc / browser / settings / snake`,'t-err');
          break}
        case 'neofetch':neofetch();break;
        case 'date':print(new Date().toString());break;
        case 'echo':print(arg||'');break;
        case 'whoami':print('guest（一个没有任何权限，但也不想惹事的访客）');break;
        case 'ver':print('豆包 OS 25H2 (OS 内部版本 26000.1)\n本版本与真实操作系统唯一的共同点是：都会蓝屏（在别的电脑上）。');break;
        case 'df':print('文件系统      容量   已用  可用  使用率  挂载点\n/dev/fake      512G   500G   12G   98%    /\n（别慌，这些数字也是假的）','t-dim');break;
        case 'uptime':print(`已运行 ${Math.floor((Date.now()-BOOT_TIME)/60000)} 分钟（这期间它什么都没做，但看起来很忙）`);break;
        case 'sudo':
          if(arg.includes('rm'))print('sudo: 已拒绝执行。\n这是网页，不是你的生活，删不掉什么的。','t-err');
          else print('sudo: 你确实没有权限。\n但好消息是，这个系统里没有任何需要权限的东西。','t-ok');
          break;
        case 'rm':
          if(arg==='-rf /')print('rm: 已拒绝执行。\n这是网页，不是你的生活，删不掉什么的。','t-err');
          else if(arg)print(`rm: 无法删除「${arg}」：权限不足（其实是懒得实现删除功能）`,'t-err');
          else print('用法：rm [-rf] 文件\n提示：任何文件都不会被真的删除，就像你的决心。');
          break;
        case 'lock':print('正在锁定…');lockScreen();break;
        case 'shutdown':print('正在关机…');setTimeout(doShutdown,300);break;
        case 'reboot':print('正在重启…');setTimeout(doRestart,300);break;
        case '42':print('答案是什么？生命、宇宙以及一切的答案。但问题是，你连问题是什么都不知道。','t-ok');break;
        case 'ip':print('本机 IP：192.168.1.101（假的，但很逼真）');break;
        case 'crypto':print('正在挖掘数字货币……\n（骗你的，网页挖不了矿）','t-dim');break;
        default:
          print(`bash: ${cmd}: 未找到命令。试试 <span class="t-ok">help</span>。`,'t-err');
      }
    }
    inp.addEventListener('keydown',e=>{
      if(e.key!=='Enter')return;
      const v=inp.value;inp.value='';
      print(`<span class="t-path">guest@豆包OS:~$</span> <span class="t-cmd">${esc(v)}</span>`);
      run(v);
      out.scrollTop=out.scrollHeight;
    });
    win.el.addEventListener('pointerdown',()=>{if(!win.min)setTimeout(()=>inp.focus(),50)});
    banner();setTimeout(()=>inp.focus(),280);
  }};
};

          <div class="set-row"><div class="lab"><b>系统音效</b><span>点击、打开、关闭时的提示音</span></div>
            <div class="switch${state.sound?' on':''}" id="setSound"></div></div>
          <div class="set-row"><div class="lab"><b>音量</b><span>${Math.round(state.volume*100)}%</span></div>
            <input type="range" class="slider" id="setVol" min="0" max="100" value="${Math.round(state.volume*100)}"></div>
          <div class="set-row"><div class="lab"><b>测试音效</b><span>点一下，听听这个系统有多假</span></div>
            <button class="btn-sec" id="setTest">播放测试音</button></div>`;
        if(tab==='about')main.innerHTML=`
          <h3>关于</h3><div class="sub">豆包 OS 25H2</div>
          <div class="syscard">
            ${[['设备名称','DOUBAO-PC'],['处理器','心情处理器 2.0 GHz（4 核 8 线程，全是想象）'],['内存','16 GB（其中 15.9 GB 是氛围感）'],['磁盘','512 GB 固态硬盘（虚拟的）'],['系统版本','豆包 OS 25H2 (OS 内部版本 26000.1)'],['内核版本','6.6.6-doubao']].map(([k,v])=>`<div class="row"><span>${k}</span><b>${v}</b></div>`).join('')}
          </div>
          <div class="syscard">
            <div class="row"><span>账户</span><b>${esc(state.user)}</b></div>
            <div style="display:flex;gap:8px;margin-top:10px"><input id="setRename" style="flex:1;background:var(--surface3);border:1px solid var(--border);border-radius:7px;padding:7px 11px;font-size:13px;outline:none" placeholder="输入新用户名"><button class="btn-pri" id="setRenameBtn">改名</button></div>
          </div>
          <p style="font-size:11.5px;color:var(--text-faint);line-height:1.7">豆包 OS 是一个运行在浏览器里的模拟操作系统：没有内核、没有驱动、没有真正的文件系统。它存在的意义，是让你在打开它的三十秒里，短暂地相信自己是这台电脑的主人。<br><br>© 2026 豆包 OS · 骗人，我们是认真的。</p>`;
        bindTab(tab);
      }
      function bindTab(tab){
        const w=win.el;
        if(tab==='system'){
          w.querySelectorAll('#setTheme button').forEach(b=>b.addEventListener('click',()=>{state.theme=b.dataset.t;applyTheme();saveSettings();showTab('system')}));
          w.querySelectorAll('#setAccent .swatch').forEach(s=>s.addEventListener('click',()=>{state.accent=s.dataset.a;state.accent2=s.dataset.b;applyTheme();saveSettings();showTab('system');toast('强调色已更新','ok','palette')}));
          const au=w.querySelector('#setAuto');au.addEventListener('click',()=>{au.classList.toggle('on');store.set('autologin',au.classList.contains('on'));toast('下次打开自动进入桌面'+(au.classList.contains('on')?'（大概）':'（已取消）'),'info')});
          const up=w.querySelector('#setUpdate'),bar=w.querySelector('#upBar');
          up.addEventListener('click',()=>{
            up.disabled=true;up.textContent='检查中…';bar.style.display='block';
            let p=0;const iv=setInterval(()=>{
              p+=Math.random()*14+5;bar.querySelector('i').style.width=Math.min(100,p)+'%';
              if(p>=100){clearInterval(iv);setTimeout(()=>{bar.style.display='none';up.disabled=false;up.textContent='检查更新';toast('已是最新版本（毕竟没有版本可言）','ok','check')},400)}
            },180);
          });
        }
        if(tab==='personal'){
          w.querySelectorAll('#setWalls .wp-thumb').forEach(t=>t.addEventListener('click',()=>{
            state.wallpaper=t.dataset.w;applyWallpaper();saveSettings();
            w.querySelectorAll('#setWalls .wp-thumb').forEach(x=>x.classList.remove('on'));t.classList.add('on');
            toast('壁纸已更换','ok','palette');
          }));
          const dy=w.querySelector('#setDyn');
          dy.addEventListener('click',()=>{dy.classList.toggle('on');state.dynamic=dy.classList.contains('on');applyWallpaper();saveSettings()});
        }
        if(tab==='sound'){
          const sw=w.querySelector('#setSound');
          sw.addEventListener('click',()=>{
            sw.classList.toggle('on');state.sound=sw.classList.contains('on');
            SFX.enable(state.sound);saveSettings();
            toast(state.sound?'音效已开启':'音效已关闭',state.sound?'ok':'info');
            if(state.sound)SFX.success();
          });
          const vol=w.querySelector('#setVol');
          vol.addEventListener('input',()=>{state.volume=vol.value/100;SFX.setVol(state.volume);saveSettings();vol.parentElement.querySelector('.lab span').textContent=Math.round(state.volume*100)+'%'});
          w.querySelector('#setTest').addEventListener('click',()=>{
            if(!state.sound){SFX.enable(true);state.sound=true;const s=w.querySelector('#setSound');s.classList.add('on');saveSettings()}
            SFX.success();SFX.boot();
          });
        }
        if(tab==='about'){
          const btn=w.querySelector('#setRenameBtn');
          btn.addEventListener('click',()=>{
            const v=w.querySelector('#setRename').value.trim();
            if(!v){toast('请输入一个名字','warn','x');return}
            state.user=v;saveSettings();
            $('#lgName').textContent=v;$('#smName').textContent=v;
            showTab('about');toast('已改名为 '+v,'ok','user');
          });
        }
      }
      showTab(win.__pendingTab||opts.tab||'system');
    }};
  },
    goto(win,opts){if(win.__showTab)win.__showTab(opts.tab);else win.__pendingTab=opts.tab}
};

/* ---------- 清理大师 ---------- */
APP_BUILD.cleaner={
  build(opts={}){
    const html=`
      <div class="cleaner">
        <div class="cl-ring">
          <svg width="150" height="150" viewBox="0 0 150 150">
            <defs><linearGradient id="clGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="rgb(var(--accent))"/><stop offset="1" stop-color="rgb(var(--accent2))"/></linearGradient></defs>
            <circle cx="75" cy="75" r="66" fill="none" stroke="var(--surface3)" stroke-width="10"/>
            <circle id="clArc" cx="75" cy="75" r="66" fill="none" stroke="url(#clGrad)" stroke-width="10" stroke-linecap="round" stroke-dasharray="414.7" stroke-dashoffset="414.7"/>
          </svg>
          <div class="cl-num"><span id="clPct">0%</span><small id="clClean">0 MB</small></div>
        </div>
        <div class="cl-stage" id="clStage">点击下方按钮，开始一场酣畅淋漓的清理</div>
        <button class="btn-pri" id="clStart">开始深度清理</button>
        <div class="cl-stats" id="clStats"></div>
      </div>`;
    return {title:'清理大师',html,onMount(win){
      const el=win.el,pctEl=el.querySelector('#clPct'),arc=el.querySelector('#clArc'),stage=el.querySelector('#clStage'),start=el.querySelector('#clStart'),cleanEl=el.querySelector('#clClean'),stats=el.querySelector('#clStats');
      const JUNK=[
        ['缓存文件','sparkle','486 MB'],['临时文件','trash','212 MB'],['浏览器垃圾','globe','356 MB'],
        ['系统日志','doc','98 MB'],['无效快捷方式','grid','42 MB'],['内存占用','cpu','1.2 GB']
      ];
      let timer=null;
      function run(){
        clearInterval(timer);
        stats.innerHTML='';el.querySelector('#clStart').disabled=true;
        let p=0,cleaned=0,si=0;
        timer=setInterval(()=>{
          p+=Math.random()*5+3;cleaned+=Math.random()*55+20;
          if(p>=100){p=100;clearInterval(timer);
            el.querySelector('#clStart').disabled=false;el.querySelector('#clStart').textContent='再扫一次';
            stage.innerHTML='<span style="color:#4cc38a">清理完成！共释放 3.42 GB 空间（数字是编的，爽感是真的）</span>';
            SFX.success();
            pushNotif('fire','清理大师','本次共清理 3.42 GB 垃圾文件。你的电脑从未如此干净——虽然它什么都没存过。');
            return;
          }
          if(p>si*18+12){si++;const j=JUNK[si-1];
            if(j)stats.insertAdjacentHTML('beforeend',`<div class="cl-stat"><span class="cs-ic">${monoIcon(j[1],17)}</span><span class="cs-lb">${j[0]}</span><span class="cs-v cs-done">已清理 ${j[2]}</span></div>`);
          }
          pctEl.textContent=Math.floor(p)+'%';
          cleanEl.textContent=(cleaned/1024).toFixed(2)+' GB';
          arc.style.strokeDashoffset=414.7*(1-p/100);
          stage.textContent=['正在扫描系统垃圾…','正在清理缓存文件…','正在优化内存占用…','正在压缩老文件…','正在假装很努力…'][Math.floor(p/20)%5];
        },240);
      }
      start.addEventListener('click',run);
      run();
    }};
  },
    goto(win,opts){}
};

/* ---------- 贪吃蛇 ---------- */
APP_BUILD.snake={
  build(opts={}){
    const html=`
      <div class="snake-wrap">
        <div class="snake-hud"><span>得分 <b id="snScore">0</b></span><span>最高 <b id="snBest">${store.get('snakeBest',0)}</b></span><button class="btn-sec" id="snRestart">重新开始</button></div>
        <canvas class="snake-canvas" id="snCanvas" width="460" height="460"></canvas>
        <div class="snake-dpad">
          <span></span><button data-d="up">▲</button><span></span>
          <button data-d="left">◀</button><button data-d="down">▼</button><button data-d="right">▶</button>
        </div>
      </div>`;
    return {title:'贪吃蛇',html,onMount(win){
      const canvas=win.el.querySelector('#snCanvas'),ctx=canvas.getContext('2d');
      const N=20,cell=canvas.width/N;
      let snake,food,dir,nextDir,score,alive,timer;
      function reset(){
        snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];
        dir={x:1,y:0};nextDir=dir;score=0;alive=true;
        win.el.querySelector('#snScore').textContent=0;
        food=randFood();draw();
        clearInterval(timer);timer=setInterval(step,130);
      }
      function randFood(){
        let p;do{p={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(s=>s.x===p.x&&s.y===p.y));
        return p;
      }
      function step(){
        if(!alive)return;
        dir=nextDir;
        const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
        if(head.x<0||head.y<0||head.x>=N||head.y>=N||snake.some(s=>s.x===head.x&&s.y===head.y)){
          alive=false;clearInterval(timer);
          const best=Math.max(store.get('snakeBest',0),score);
          store.set('snakeBest',best);win.el.querySelector('#snBest').textContent=best;
          draw();
          ctx.fillStyle='rgba(10,14,24,.82)';ctx.fillRect(0,0,canvas.width,canvas.height);
          ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.textAlign='center';
          ctx.fillText('游戏结束',canvas.width/2,canvas.height/2-12);
          ctx.fillStyle='rgba(255,255,255,.75)';ctx.font='15px sans-serif';
          ctx.fillText('得分 '+score+' · 点击重新开始',canvas.width/2,canvas.height/2+18);
          return;
        }
        snake.unshift(head);
        if(head.x===food.x&&head.y===food.y){score+=10;win.el.querySelector('#snScore').textContent=score;food=randFood()}
        else snake.pop();
        draw();
      }
      function draw(){
        ctx.fillStyle='#0d1220';ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.strokeStyle='rgba(255,255,255,.045)';ctx.lineWidth=1;
        for(let i=1;i<N;i++){ctx.beginPath();ctx.moveTo(i*cell,0);ctx.lineTo(i*cell,canvas.height);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*cell);ctx.lineTo(canvas.width,i*cell);ctx.stroke()}
        ctx.fillStyle='#ff5e62';ctx.beginPath();ctx.arc(food.x*cell+cell/2,food.y*cell+cell/2,cell*0.34,0,Math.PI*2);ctx.fill();
        snake.forEach((s,i)=>{
          const g=i/snake.length;
          ctx.fillStyle=`rgb(${40+90*(1-g)},${180+40*g},${120+80*g})`;
          ctx.beginPath();ctx.roundRect(s.x*cell+1.5,s.y*cell+1.5,cell-3,cell-3,4);ctx.fill();
        });
      }
      win.el.addEventListener('keydown',e=>{
        const map={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},w:{x:0,y:-1},s:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0}};
        const nd=map[e.key]||map[e.key.toLowerCase()];
        if(nd&&(nd.x!==-dir.x||nd.y!==-dir.y))nextDir=nd;
      });
      win.el.querySelectorAll('.snake-dpad button').forEach(b=>b.addEventListener('click',()=>{
        const map={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
        const nd=map[b.dataset.d];
        if(nd&&(nd.x!==-dir.x||nd.y!==-dir.y))nextDir=nd;
      }));
      canvas.addEventListener('click',()=>{if(!alive)reset()});
      win.el.querySelector('#snRestart').addEventListener('click',reset);
      reset();
    }};
  },
    goto(win,opts){}
};
