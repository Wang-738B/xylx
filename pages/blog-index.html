                zh: { title: "Android中的奇怪时间BUG", excerpt: "在部分 Android 系统（MIUI13，Android 12 内核）中，把时间调到上限 2037.12.31 后再同步，时间竟跳到 2094 年；两次跳变都恰好接近 32 位有符号整数上限 2³¹−1，是 Android 遗留，还是小米定制时的疏漏？" },
                en: { title: "The Weird Android Time Bug", excerpt: "On some Android builds (MIUI 13, Android 12), setting the clock to its 2037.12.31 limit and syncing jumps the time to 2094. Both jumps landed just under the 32-bit signed int max — a leftover overflow bug, or a MIUI customization slip?" }
            }
        ];

        const TAG_LABELS = {
            site:     { zh: "建站",     en: "Site" },
            life:     { zh: "生活",     en: "Life" },
            tech:     { zh: "技术",     en: "Tech" },
            science:  { zh: "科普",     en: "Science" },
            security: { zh: "网络安全", en: "Security" },
            video:    { zh: "视频",     en: "Video" },
            hardware: { zh: "硬件",     en: "Hardware" }
        };

        const ARROW_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"/><path d="M7 7h10v10"/></svg>';

        /* ==================== 界面文案（双语） ==================== */
        const LANG = {
            zh: {
                blogTitle: "个人博客",
                blogSubtitle: "记录生活与技术的数字花园",
                searchPh: "搜索文章标题、摘要或标签…",
                allTag: "全部",
                sortLabel: "排序",
                sortNew: "最新",
                sortOld: "最早",
                readTime: m => "约 " + m + " 分钟",
                statPosts: "篇文章",
                statTags: "个标签",
                statMins: "分钟阅读",
                emptyTitle: "没有找到相关文章",
                emptyDesc: "换个关键词，或清除筛选条件试试。",
                resetBtn: "清除筛选",
                copyright: "© 丙午2026 xyLX·Wang · 保留所有权利",
                powered: "由 Cloudflare 提供支持",
                langBtn: "en",
                docTitle: "个人博客 | xyLX·Wang"
            },
            en: {
                blogTitle: "Personal Blog",
                blogSubtitle: "A digital garden of life & tech",
                searchPh: "Search title, excerpt or tags…",
                allTag: "All",
                sortLabel: "Sort",
                sortNew: "Newest",
                sortOld: "Oldest",
                readTime: m => "~" + m + " min read",
                statPosts: "posts",
                statTags: "tags",
                statMins: "min read",
                emptyTitle: "No posts found",
                emptyDesc: "Try another keyword, or clear the filters.",
                resetBtn: "Clear filters",
                copyright: "© 2026 xyLX·Wang · All Rights Reserved",
                powered: "Powered by Cloudflare",
                langBtn: "汉",
                docTitle: "Personal Blog | xyLX·Wang"
            }
        };

        let lang = "zh";
        try { lang = localStorage.getItem("siteLang") || "zh"; } catch (e) { }
        const t = key => LANG[lang][key];

        /* ==================== 状态 ==================== */
        const state = { query: "", tags: new Set(), sort: "new" };

        /* ==================== 工具函数 ==================== */
        function escapeHtml(s) {
            return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        }
        function highlight(text, q) {
            const safe = escapeHtml(text);
            if (!q) return safe;
            const esc = escapeHtml(q).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            return safe.replace(new RegExp("(" + esc + ")", "gi"), "<mark>$1</mark>");
        }
        const minutesOf = p => Math.max(1, Math.round(p.words / 300));
        const totalMinutes = () => Math.max(1, Math.round(POSTS.reduce((s, p) => s + p.words, 0) / 300));

        /* ==================== 渲染：统计 ==================== */
        function renderStats() {
            const tagsCount = new Set(POSTS.flatMap(p => p.tags)).size;
            document.getElementById("statsRow").innerHTML =
                '<span class="stat"><b>' + POSTS.length + '</b> ' + t("statPosts") + "</span>" +
                '<span class="stat"><b>' + tagsCount + '</b> ' + t("statTags") + "</span>" +
                '<span class="stat"><b>~' + totalMinutes() + '</b> ' + t("statMins") + "</span>";
        }

        /* ==================== 渲染：标签 ==================== */
        function renderTags() {
            const counts = {};
            POSTS.forEach(p => p.tags.forEach(tg => counts[tg] = (counts[tg] || 0) + 1));
            const order = Object.keys(counts);
            const wrap = document.getElementById("tagRow");
            const frag = document.createDocumentFragment();
            const mk = (key, label, cnt, active) => {
                const b = document.createElement("button");
                b.className = "tag-chip" + (active ? " active" : "");
                b.dataset.tag = key;
                b.setAttribute("aria-pressed", active ? "true" : "false");
                b.innerHTML = label + (cnt > 0 ? '<span class="cnt">' + cnt + "</span>" : "");
                return b;
            };
            frag.appendChild(mk("all", t("allTag"), POSTS.length, state.tags.size === 0));
            order.forEach(tg => frag.appendChild(mk(tg, TAG_LABELS[tg][lang], counts[tg], state.tags.has(tg))));
            wrap.innerHTML = "";
            wrap.appendChild(frag);
        }

        /* ==================== 渲染：文章列表 ==================== */
        function renderList() {
            const q = state.query.trim().toLowerCase();
            const list = POSTS.filter(p => {
                if (state.tags.size && !p.tags.some(tg => state.tags.has(tg))) return false;
                if (q) {
                    const hay = (p.zh.title + " " + p.zh.excerpt + " " +
                        p.tags.map(tg => TAG_LABELS[tg].zh + " " + TAG_LABELS[tg].en).join(" ")).toLowerCase();
                    if (!hay.includes(q)) return false;
                }
                return true;
            });
            list.sort((a, b) => state.sort === "new" ? (a.date < b.date ? 1 : -1) : (a.date < b.date ? -1 : 1));

            const wrap = document.getElementById("blogList");
            wrap.innerHTML = "";
            if (!list.length) {
                document.getElementById("emptyState").classList.add("show");
                return;
            }
            document.getElementById("emptyState").classList.remove("show");

            const frag = document.createDocumentFragment();
            list.forEach((p, i) => {
                const card = document.createElement("a");
                card.className = "blog-card";
                card.href = p.file;
                card.setAttribute("aria-label", p[lang].title);

                const top = document.createElement("div");
                top.className = "card-top";
                const date = document.createElement("span");
                date.className = "card-date";
                date.textContent = p.date;
                const read = document.createElement("span");
                read.className = "card-read";
                read.textContent = t("readTime")(minutesOf(p));
                const tags = document.createElement("span");
                tags.className = "card-tags";
                p.tags.forEach(tg => {
                    const s = document.createElement("span");
                    s.className = "card-tag";
                    s.innerHTML = highlight(TAG_LABELS[tg][lang], q);
                    tags.appendChild(s);
                });
                top.append(date, read, tags);

                const title = document.createElement("h2");
                title.className = "card-title";
                title.innerHTML = highlight(p[lang].title, q);

                const ex = document.createElement("p");
                ex.className = "card-excerpt";
                ex.innerHTML = highlight(p[lang].excerpt, q);

                const arrow = document.createElement("span");
                arrow.className = "card-arrow";
                arrow.setAttribute("aria-hidden", "true");
                arrow.innerHTML = ARROW_SVG;

                card.append(top, title, ex, arrow);
                frag.appendChild(card);
            });
            wrap.appendChild(frag);

            /* 入场 stagger：仅首次渲染延迟错开，之后直接呈现 */
            const cards = wrap.querySelectorAll(".blog-card");
            cards.forEach((c, i) => {
                c.classList.add("anim-in");
                if (!renderList._animated) c.style.animationDelay = (i * 60) + "ms";
            });
            renderList._animated = true;
        }

        /* ==================== 渲染总入口 ==================== */
        function render() {
            renderStats();
            renderTags();
            renderList();
            document.getElementById("clearBtn").classList.toggle("show", state.query.length > 0);
            const input = document.getElementById("searchInput");
            if (input.value !== state.query) input.value = state.query;
        }

        /* ==================== 交互：搜索 / 标签 / 排序 ==================== */
        const searchInput = document.getElementById("searchInput");
        let debounceTimer = null;
        searchInput.addEventListener("input", () => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                state.query = searchInput.value;
                render();
            }, 120);
        });

        document.getElementById("clearBtn").addEventListener("click", () => {
            state.query = "";
            render();
            searchInput.focus();
        });

        document.getElementById("tagRow").addEventListener("click", e => {
            const chip = e.target.closest(".tag-chip");
            if (!chip) return;
            const key = chip.dataset.tag;
            if (key === "all") state.tags.clear();
            else if (state.tags.has(key)) state.tags.delete(key);
            else state.tags.add(key);
            render();
        });

        document.querySelectorAll(".sort-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                state.sort = btn.dataset.sort;
                document.querySelectorAll(".sort-btn").forEach(b => b.classList.toggle("active", b === btn));
                render();
            });
        });

        document.getElementById("resetBtn").addEventListener("click", () => {
            state.query = "";
            state.tags.clear();
            state.sort = "new";
            document.getElementById("sortNew").classList.add("active");
            document.getElementById("sortOld").classList.remove("active");
            render();
            searchInput.focus();
        });

        /* 键盘快捷键：/ 聚焦搜索，Esc 清空 */
        document.addEventListener("keydown", e => {
            const tag = (e.target.tagName || "").toLowerCase();
            if (e.key === "/" && tag !== "input" && tag !== "textarea") {
                e.preventDefault();
                searchInput.focus();
            }
            if (e.key === "Escape" && document.activeElement === searchInput) {
                state.query = "";
                render();
                searchInput.blur();
            }
        });

        /* ==================== 双语切换 ==================== */
        function setLang(l) {
            lang = l;
            try { localStorage.setItem("siteLang", l); } catch (e) { }
            document.documentElement.lang = l === "zh" ? "zh-CN" : "en";
            document.title = t("docTitle");
            document.getElementById("langBtn").textContent = t("langBtn");
            searchInput.placeholder = t("searchPh");
            document.querySelectorAll("[data-lang]").forEach(el => {
                const key = el.getAttribute("data-lang");
                if (LANG[l][key] !== undefined) el.textContent = LANG[l][key];
            });
            render();
        }
        document.getElementById("langBtn").addEventListener("click", () => setLang(lang === "zh" ? "en" : "zh"));
        setLang(lang);

        /* ==================== 明暗主题 ==================== */
        const themeBtn = document.getElementById("themeBtn");
        const themeSun = document.getElementById("themeSun");
        const themeMoon = document.getElementById("themeMoon");
        function updateThemeIcon() {
            const dark = document.documentElement.getAttribute("data-theme") === "dark";
            themeSun.style.display = dark ? "block" : "none";
            themeMoon.style.display = dark ? "none" : "block";
        }
        themeBtn.addEventListener("click", () => {
            const cur = document.documentElement.getAttribute("data-theme");
            const next = cur === "dark" ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", next);
            try { localStorage.setItem("siteTheme", next); } catch (e) { }
            updateThemeIcon();
        });
        updateThemeIcon();

        /* ==================== 金沙粒子（升级：鼠标拨动 + 数量自适应 + DPR 高清） ==================== */
        (function () {
            const canvas = document.getElementById("goldSandCanvas");
            if (!canvas || !canvas.getContext) return;
            const ctx = canvas.getContext("2d");
            const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            let W = 0, H = 0, particles = [];
            let mouse = { x: null, y: null };
            let rafId = null;
            let resizeTimer = null;
            const colors = ["#fff1b8", "#ffdd70", "#f7c84e", "#e8b435", "#d4a028", "#c28c1c"];

            function resize() {
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.width = Math.round(W * dpr);
                canvas.height = Math.round(H * dpr);
                canvas.style.width = W + "px";
                canvas.style.height = H + "px";
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                createParticles();
            }
            function createParticles() {
                const count = reduced ? 0 : Math.max(50, Math.min(240, Math.round(W * H / 9000)));
                particles = new Array(count);
                for (let i = 0; i < count; i++) {
                    particles[i] = {
                        x: Math.random() * W,
                        y: Math.random() * H,
                        size: Math.random() * 3.2 + 0.4,
                        sx: (Math.random() - 0.5) * 0.35,
                        sy: (Math.random() - 0.5) * 0.25,
                        color: colors[(Math.random() * colors.length) | 0],
                        alpha: Math.random() * 0.7 + 0.15,
                        tw: Math.random() * 0.018 + 0.004
                    };
                }
            }
            function animate() {
                ctx.clearRect(0, 0, W, H);
                const R = 110, R2 = R * R;
                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    p.alpha += p.tw;
                    if (p.alpha > 0.85 || p.alpha < 0.12) p.tw = -p.tw;
                    let dx = 0, dy = 0;
                    if (mouse.x !== null) {
                        const mx = p.x - mouse.x, my = p.y - mouse.y;
                        const d2 = mx * mx + my * my;
                        if (d2 < R2 && d2 > 0.01) {
                            const d = Math.sqrt(d2);
                            const force = (R - d) / R * 0.7;
                            dx = mx / d * force;
                            dy = my / d * force;
                        }
                    }
                    p.x += p.sx + dx;
                    p.y += p.sy + dy;
                    if (p.x > W) p.x = 0; else if (p.x < 0) p.x = W;
                    if (p.y > H) p.y = 0; else if (p.y < 0) p.y = H;
                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
                rafId = requestAnimationFrame(animate);
            }
            window.addEventListener("pointermove", e => {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
            }, { passive: true });
            window.addEventListener("pointerleave", () => { mouse.x = null; mouse.y = null; });
            window.addEventListener("resize", () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(resize, 200);
            });
            resize();
            if (!reduced) animate();
        })();

        /* ==================== 控制台彩蛋 ==================== */
        console.log("%c📖 这里是博客页面", "font-size:18px;color:#946c22;");
        console.log("提示：按 / 快速搜索文章；右上角可切换明暗主题；返回首页 index.html 还有隐藏彩蛋。");

        /* ==================== 从 URL 参数恢复搜索（主页菜单搜索跳转） ==================== */
        try {
            const urlParams = new URLSearchParams(window.location.search);
            const q = (urlParams.get("q") || "").trim();
            if (q) {
                state.query = q;
                const input = document.getElementById("searchInput");
                if (input) input.value = q;
                render();
                const firstCard = document.querySelector(".blog-card");
                if (firstCard) {
                    const y = firstCard.getBoundingClientRect().top + window.scrollY - 90;
                    window.scrollTo({ top: y, behavior: "smooth" });
                }
            }
        } catch (e) { }

    </script>
