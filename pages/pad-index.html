<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>建议反馈 · xyLX·Wang</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   留言板页面 — 与 xylx.pages.dev 视觉语言一致
   沙色亮场 · 衬线编辑体 · 金色粒子 · 小圆角编辑风格
   ═══════════════════════════════════════════════════════════════ */
:root{
  --canvas:#F5F2EC;
  --ink:#4A3818;
  --accent:#946c22;
  --accent-light:#b39862;
  --muted:#8B7355;
  --line:rgba(148,108,34,.18);
  --card-bg:rgba(255,253,248,.72);
  --card-border:rgba(148,108,34,.22);
  --gut:clamp(20px,4vw,64px);
  --ease:cubic-bezier(.22,.61,.36,1);
  --radius-card:4px;
  --radius-control:6px;
  --radius-pill:999px;
  --shadow-card:
    0 1px 2px rgba(74,56,24,.04),
    0 8px 24px -8px rgba(74,56,24,.10),
    0 24px 48px -20px rgba(74,56,24,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--canvas);
  color:var(--ink);
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  min-height:100vh;
  position:relative;
}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button,a[href]{min-height:24px}

/* ── 背景层 ─────────────────────────────────────────────────── */
.bg-layer{
  position:fixed;inset:0;z-index:0;
  background:url('../image/index-background.jpg') center/cover no-repeat;
}
.bg-layer::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(245,242,236,.82),rgba(245,242,236,.90));
}
#goldSandCanvas{
  position:fixed;inset:0;z-index:1;
  pointer-events:none;
}

/* ── 内容层 ─────────────────────────────────────────────────── */
.page-wrap{
  position:relative;z-index:2;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* ── 顶部导航 ───────────────────────────────────────────────── */
.top-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:20px var(--gut);
  position:sticky;
  top:0;
  z-index:10;
  backdrop-filter:blur(8px);
  background:rgba(245,242,236,.65);
  border-bottom:1px solid var(--line);
}
.back-btn{
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 16px;
  border-radius:var(--radius-pill);
  border:1px solid var(--card-border);
  background:var(--card-bg);
  color:var(--muted);
  font-size:14px;
  transition:all .2s var(--ease);
}
.back-btn:hover{
  color:var(--accent);
  border-color:var(--accent-light);
  background:rgba(255,253,248,.9);
}
.back-btn svg{width:16px;height:16px}
.page-title-nav{
  font-family:"Noto Serif SC","Songti SC","Source Han Serif",serif;
  font-size:18px;
  font-weight:600;
  color:var(--ink);
  letter-spacing:.04em;
}
.lang-indicator{
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px 14px;
  border-radius:var(--radius-pill);
  border:1px solid var(--card-border);
  background:var(--card-bg);
  color:var(--muted);
  font-size:13px;
}
.lang-indicator svg{width:14px;height:14px}

/* ── 主内容区 ───────────────────────────────────────────────── */
.main-content{
  flex:1;
  width:100%;
  max-width:760px;
  margin:0 auto;
  padding:48px var(--gut) 80px;
}

/* 页面标题区 */
.hero-section{
  text-align:center;
  margin-bottom:48px;
  opacity:0;
  transform:translateY(20px);
  animation:fadeUp .9s var(--ease) .1s forwards;
}
@keyframes fadeUp{
  to{opacity:1;transform:none}
}
.hero-icon{
  width:48px;height:48px;
  margin:0 auto 20px;
  color:var(--accent);
  opacity:.8;
}
.hero-title{
  font-family:"Noto Serif SC","Songti SC","Source Han Serif",serif;
  font-size:clamp(2rem,5vw,3rem);
  font-weight:700;
  color:var(--ink);
  letter-spacing:.06em;
  margin-bottom:12px;
  line-height:1.2;
}
.hero-subtitle{
  font-size:15px;
  color:var(--muted);
  max-width:480px;
  margin:0 auto;
  line-height:1.7;
}
.hero-divider{
  width:48px;
  height:1px;
  background:var(--accent-light);
  margin:24px auto 0;
  opacity:.5;
}

/* ── 留言表单 ───────────────────────────────────────────────── */
.form-section{
  margin-bottom:48px;
  opacity:0;
  transform:translateY(20px);
  animation:fadeUp .9s var(--ease) .25s forwards;
}
.form-card{
  background:var(--card-bg);
  backdrop-filter:blur(10px);
  border:1px solid var(--card-border);
  border-radius:var(--radius-card);
  padding:28px;
  box-shadow:var(--shadow-card);
}
.form-label{
  display:block;
  font-size:13px;
  font-weight:600;
  color:var(--muted);
  margin-bottom:8px;
  letter-spacing:.04em;
}
.form-label .required{
  color:var(--accent);
  margin-left:2px;
}
.input-group{
  margin-bottom:20px;
}
.input-group:last-of-type{
  margin-bottom:24px;
}
.form-input,
.form-textarea{
  width:100%;
  padding:12px 16px;
  border:1px solid var(--card-border);
  border-radius:var(--radius-control);
  background:rgba(255,253,248,.8);
  color:var(--ink);
  font-family:inherit;
  font-size:15px;
  line-height:1.5;
  transition:all .2s var(--ease);
  outline:none;
}
.form-input:focus,
.form-textarea:focus{
  border-color:var(--accent-light);
  box-shadow:0 0 0 3px rgba(148,108,34,.1);
  background:rgba(255,253,248,.95);
}
.form-input::placeholder,
.form-textarea::placeholder{
  color:rgba(139,115,85,.5);
}
.form-textarea{
  resize:vertical;
  min-height:100px;
  max-height:300px;
}
/* 蜜罐字段：对真人隐藏，拦截自动填表的爬虫/脚本 */
.hp-field{
  position:absolute;
  left:-9999px;
  top:-9999px;
  width:1px;
  height:1px;
  opacity:0;
  overflow:hidden;
  pointer-events:none;
}
.form-footer{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
}
.char-count{
  font-size:12px;
  color:var(--muted);
  opacity:.7;
}
.char-count.over{
  color:#c0392b;
}
.submit-btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:10px 28px;
  border-radius:var(--radius-pill);
  border:1px solid var(--accent-light);
  background:linear-gradient(135deg,rgba(148,108,34,.08),rgba(179,152,98,.12));
  color:var(--accent);
  font-size:14px;
  font-weight:600;
  letter-spacing:.04em;
  transition:all .25s var(--ease);
  position:relative;
  overflow:hidden;
}
.submit-btn:hover:not(:disabled){
  background:linear-gradient(135deg,rgba(148,108,34,.15),rgba(179,152,98,.2));
  border-color:var(--accent);
  transform:translateY(-1px);
  box-shadow:0 4px 12px rgba(148,108,34,.18);
}
.submit-btn:active:not(:disabled){
  transform:translateY(0);
}
.submit-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}
.submit-btn svg{
  width:16px;height:16px;
  transition:transform .25s var(--ease);
}
.submit-btn:hover:not(:disabled) svg{
  transform:translateX(2px);
}
.submit-btn.loading svg{
  animation:spin .8s linear infinite;
}
@keyframes spin{
  to{transform:rotate(360deg)}
}

/* 提交成功提示 */
.toast{
  position:fixed;
  top:80px;
  left:50%;
  transform:translateX(-50%) translateY(-20px);
  background:rgba(74,56,24,.92);
  color:#F5F2EC;
  padding:12px 28px;
  border-radius:var(--radius-pill);
  font-size:14px;
  z-index:100;
  opacity:0;
  pointer-events:none;
  transition:all .35s var(--ease);
  backdrop-filter:blur(8px);
  box-shadow:0 8px 24px rgba(74,56,24,.3);
}
.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* ── 留言列表 ───────────────────────────────────────────────── */
.list-section{
  opacity:0;
  transform:translateY(20px);
  animation:fadeUp .9s var(--ease) .4s forwards;
}
.list-header{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  margin-bottom:24px;
  padding-bottom:16px;
  border-bottom:1px solid var(--line);
}
.list-title{
  font-family:"Noto Serif SC","Songti SC","Source Han Serif",serif;
  font-size:20px;
  font-weight:600;
  color:var(--ink);
  letter-spacing:.04em;
}
.list-count{
  font-size:13px;
  color:var(--muted);
}
.list-count strong{
  color:var(--accent);
  font-weight:600;
}

/* 留言卡片 */
.message-list{
  display:flex;
  flex-direction:column;
  gap:16px;
}
.message-card{
  background:var(--card-bg);
  backdrop-filter:blur(8px);
  border:1px solid var(--card-border);
  border-radius:var(--radius-card);
  padding:22px 24px;
  box-shadow:var(--shadow-card);
  transition:all .3s var(--ease);
  animation:msgIn .5s var(--ease) both;
}
@keyframes msgIn{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:none}
}
.message-card:hover{
  border-color:rgba(148,108,34,.35);
  box-shadow:
    0 1px 2px rgba(74,56,24,.05),
    0 12px 32px -8px rgba(74,56,24,.14),
    0 32px 56px -20px rgba(74,56,24,.18);
  transform:translateY(-2px);
}
.msg-header{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:14px;
}
.msg-avatar{
  width:40px;height:40px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--accent-light),var(--accent));
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:16px;
  font-weight:600;
  flex-shrink:0;
  box-shadow:0 2px 8px rgba(148,108,34,.25);
}
.msg-meta{
  flex:1;
  min-width:0;
}
.msg-name{
  font-size:15px;
  font-weight:600;
  color:var(--ink);
  margin-bottom:2px;
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}
/* 类型徽章与状态徽章 */
.type-badge,
.state-badge{
  display:inline-block;
  font-size:11px;
  font-weight:600;
  line-height:1;
  padding:3px 8px;
  border-radius:var(--radius-pill);
  letter-spacing:.02em;
}
.type-badge{
  color:var(--accent);
  background:rgba(148,108,34,.1);
  border:1px solid rgba(148,108,34,.25);
}
.state-badge.open{
  color:#7a5b1f;
  background:rgba(183,141,35,.1);
  border:1px solid rgba(183,141,35,.3);
}
.state-badge.closed{
  color:#6b7a52;
  background:rgba(107,122,82,.1);
  border:1px solid rgba(107,122,82,.28);
}
/* 反馈类型下拉框 */
.form-select{
  appearance:none;
  -webkit-appearance:none;
  -moz-appearance:none;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256' fill='%23946c22'%3E%3Cpath d='M213.66,101.66a8,8,0,0,1-11.32,0L128,27.31,53.66,101.66a8,8,0,0,1-11.32-11.32l80-80a8,8,0,0,1,11.32,0l80,80A8,8,0,0,1,213.66,101.66Zm-11.32,52.68a8,8,0,0,0-11.32,0L128,228.69,53.66,154.34a8,8,0,0,0-11.32,11.32l80,80a8,8,0,0,0,11.32,0l80-80A8,8,0,0,0,202.34,154.34Z'/%3E%3C/svg%3E");
  background-repeat:no-repeat;
  background-position:right 12px center;
  background-size:14px;
  padding-right:36px;
  cursor:pointer;
}
.msg-time{
  font-size:12px;
  color:var(--muted);
  display:flex;
  align-items:center;
  gap:4px;
}
.msg-time svg{
  width:12px;height:12px;
  opacity:.7;
}
.msg-content{
  font-size:15px;
  line-height:1.75;
  color:var(--ink);
  opacity:.9;
  word-break:break-word;
}
.msg-content p{
  margin-bottom:8px;
}
.msg-content p:last-child{
  margin-bottom:0;
}

/* 空状态 */
.empty-state{
  text-align:center;
  padding:60px 20px;
  color:var(--muted);
}
.empty-state svg{
  width:56px;height:56px;
  margin:0 auto 16px;
  opacity:.4;
}
.empty-state p{
  font-size:15px;
  line-height:1.7;
}

/* 加载更多 */
.load-more-wrap{
  text-align:center;
  margin-top:32px;
}
.load-more-btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:10px 32px;
  border-radius:var(--radius-pill);
  border:1px solid var(--card-border);
  background:var(--card-bg);
  color:var(--muted);
  font-size:14px;
  transition:all .25s var(--ease);
}
.load-more-btn:hover:not(:disabled){
  color:var(--accent);
  border-color:var(--accent-light);
  background:rgba(255,253,248,.9);
}
.load-more-btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}
.load-more-btn svg{
  width:16px;height:16px;
}
.load-more-btn.loading svg{
  animation:spin .8s linear infinite;
}
.no-more{
  text-align:center;
  margin-top:32px;
  font-size:13px;
  color:var(--muted);
  opacity:.6;
}

/* ── 页脚 ───────────────────────────────────────────────────── */
.page-footer{
  text-align:center;
  padding:32px var(--gut);
  font-size:12px;
  color:var(--muted);
  opacity:.7;
  border-top:1px solid var(--line);
  position:relative;
  z-index:2;
}

/* ── 响应式 ─────────────────────────────────────────────────── */
@media(max-width:600px){
  .main-content{padding:32px var(--gut) 60px}
  .form-card{padding:20px}
  .message-card{padding:18px 20px}
  .hero-title{font-size:1.75rem}
  .top-bar{padding:14px var(--gut)}
  .page-title-nav{font-size:16px}
  .lang-indicator{display:none}
}

/* 减少动画偏好 */
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.01ms!important}
  .hero-section,.form-section,.list-section{opacity:1;transform:none}
}
/* 演示模式提示（后端不可用时出现） */
.mode-notice{
  text-align:center;
  padding:10px 16px;
  font-size:13px;
  color:#8a6d1f;
  background:rgba(183,141,35,.08);
  border-bottom:1px solid rgba(183,141,35,.2);
  position:relative;
  z-index:2;
}
/* 列表错误 / 重试状态 */
.list-error{
  text-align:center;
  padding:48px 20px;
  color:var(--muted);
}
.list-error p{
  font-size:15px;
  line-height:1.7;
  margin-bottom:16px;
}
.retry-btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:9px 28px;
  border-radius:var(--radius-pill);
  border:1px solid var(--card-border);
  background:var(--card-bg);
  color:var(--muted);
  font-size:14px;
  transition:all .25s var(--ease);
}
.retry-btn:hover{
  color:var(--accent);
  border-color:var(--accent-light);
  background:rgba(255,253,248,.9);
}
</style>
</head>
<body>

<!-- 背景层 -->
<div class="bg-layer"></div>
<canvas id="goldSandCanvas"></canvas>

<!-- 提交成功提示 -->
<div class="toast" id="toast">留言已发送，感谢你的支持 ✦</div>

<!-- 页面内容 -->
<div class="page-wrap">

  <!-- 顶部导航 -->
  <header class="top-bar">
    <button class="back-btn" onclick="history.back()">
      <svg viewBox="0 0 256 256" fill="currentColor"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"/></svg>
      返回
    </button>
    <div class="page-title-nav">建议反馈</div>
    <div class="lang-indicator">
      <svg viewBox="0 0 256 256" fill="currentColor"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216ZM213.4,168a114.3,114.3,0,0,0-52.88-50.37,8,8,0,0,0-9.58,3.07,77.8,77.8,0,0,1-8.15,12.29,67.6,67.6,0,0,1-10.3-12.36,8,8,0,0,0-9.7-3.06A114.46,114.46,0,0,0,71,120.13a8,8,0,0,0,3.31,15.65,98.28,98.28,0,0,1,20.5-2.35c.92,1.58,1.86,3.14,2.81,4.69a8,8,0,0,0,13.54-.37,88.34,88.34,0,0,0,11.33-15.22,99.13,99.13,0,0,1,19.77,2.73,112.28,112.28,0,0,1-12.63,22.43,8,8,0,0,0,13.1,9.73A127.36,127.36,0,0,0,168.8,152a96.87,96.87,0,0,0,30.18,5.67,8,8,0,0,0,7.76-10.25c-.25-.81-.51-1.6-.79-2.39A8,8,0,0,0,213.4,168Z"/></svg>
      中文
    </div>
  </header>

  <!-- 服务异常提示（由 JS 显示） -->
  <div class="mode-notice" id="modeNotice" style="display:none">⚠ 反馈服务暂不可用，请稍后重试</div>

  <!-- 主内容 -->
  <main class="main-content">

    <!-- 页面标题 -->
    <section class="hero-section">
      <svg class="hero-icon" viewBox="0 0 256 256" fill="currentColor"><path d="M128,24A104,104,0,0,0,36.18,176.88L24.83,210.93a16,16,0,0,0,20.24,20.24l34.05-11.35A104,104,0,1,0,128,24Zm0,192a87.87,87.87,0,0,1-44.06-11.81,8,8,0,0,0-6.54-.67L40,216,52.47,178.6a8,8,0,0,0-.66-6.54A88,88,0,1,1,128,216Z"/></svg>
      <h1 class="hero-title">建议反馈</h1>
      <p class="hero-subtitle">在这里留下你的建议、问题或只是一句问候。每一条反馈都会被认真对待。</p>
      <div class="hero-divider"></div>
    </section>

    <!-- 留言表单 -->
    <section class="form-section">
      <div class="form-card">
        <form id="messageForm" onsubmit="return false;">
          <div class="input-group">
            <label class="form-label" for="nickname">昵称<span class="required">*</span></label>
            <input type="text" id="nickname" class="form-input" placeholder="怎么称呼你？" maxlength="20" autocomplete="off">
          </div>
          <div class="input-group">
            <label class="form-label" for="fbType">反馈类型<span class="required">*</span></label>
            <select id="fbType" class="form-input form-select">
              <option value="suggestion">建议</option>
              <option value="bug">问题</option>
              <option value="question">咨询</option>
            </select>
          </div>
          <div class="input-group">
            <label class="form-label" for="message">反馈内容<span class="required">*</span></label>
            <textarea id="message" class="form-textarea" placeholder="想说点什么？" maxlength="500" rows="4"></textarea>
          </div>
          <!-- 蜜罐字段：人类不可见，爬虫会自动填写，用于拦截机器人 -->
          <input type="text" id="hp" name="hp" class="hp-field" tabindex="-1" autocomplete="off" aria-hidden="true">
          <div class="form-footer">
            <span class="char-count" id="charCount">0 / 500</span>
            <button type="submit" class="submit-btn" id="submitBtn">
              <svg viewBox="0 0 256 256" fill="currentColor"><path d="M237.9,200.1,141.85,32.18a16,16,0,0,0-27.89,0l-95.89,168a16,16,0,0,0,19.26,22.92L128,192.45l90.67,30.63A16.22,16.22,0,0,0,224,224a16,16,0,0,0,13.86-23.9Zm-14.05,7.84L136,178.26V120a8,8,0,0,0-16,0v58.26L32.16,207.94,32,208,127.86,40,224,208Z"/></svg>
              提交反馈
            </button>
          </div>
        </form>
      </div>
    </section>

    <!-- 留言列表 -->
    <section class="list-section">
      <div class="list-header">
        <h2 class="list-title">全部反馈</h2>
        <span class="list-count">共 <strong id="totalCount">0</strong> 条</span>
      </div>
      <div class="message-list" id="messageList">
        <!-- 留言由 JS 动态渲染 -->
      </div>
      <div class="load-more-wrap" id="loadMoreWrap">
        <button class="load-more-btn" id="loadMoreBtn">
          <svg viewBox="0 0 256 256" fill="currentColor"><path d="M136,32V64a8,8,0,0,1-16,0V32a8,8,0,0,1,16,0Zm37.25,58.75a8,8,0,0,0,5.66-2.35l22.63-22.62a8,8,0,0,0-11.32-11.32L167.6,77.09a8,8,0,0,0,5.65,13.66ZM224,120H192a8,8,0,0,0,0,16h32a8,8,0,0,0,0-16Zm-45.09,47.6a8,8,0,0,0-11.31,11.31l22.62,22.63a8,8,0,0,0,11.32-11.32ZM128,184a8,8,0,0,0-8,8v32a8,8,0,0,0,16,0V192A8,8,0,0,0,128,184ZM77.09,167.6,54.46,190.22a8,8,0,0,0,11.32,11.32L88.4,178.91A8,8,0,0,0,77.09,167.6ZM72,128a8,8,0,0,0-8-8H32a8,8,0,0,0,0,16H64A8,8,0,0,0,72,128ZM65.78,54.46A8,8,0,0,0,54.46,65.78L77.09,88.4A8,8,0,0,0,88.4,77.09Z"/></svg>
          加载更多
        </button>
        <div class="no-more" id="noMore" style="display:none">— 已经到底啦，感谢浏览 —</div>
      </div>
    </section>

  </main>

  <!-- 页脚 -->
  <footer class="page-footer">
    © 丙午2026 xyLX·Wang · 建议反馈 · 由 Cloudflare 提供支持
  </footer>

</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   金色粒子背景 — 与首页一致的视觉语言
   ═══════════════════════════════════════════════════════════════ */
const canvas = document.getElementById('goldSandCanvas');
const ctx = canvas.getContext('2d');
let width, height, particles = [];
const goldColors = ['#fff1b8','#ffdd70','#f7c84e','#e8b435','#d4a028','#c28c1c'];

function resize(){
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}
function createParticles(count = 180){
  particles = [];
  for(let i=0;i<count;i++){
    particles.push({
      x:Math.random()*width,
      y:Math.random()*height,
      size:Math.random()*3+0.4,
      speedX:(Math.random()-0.5)*0.3,
      speedY:(Math.random()-0.5)*0.2,
      color:goldColors[Math.floor(Math.random()*goldColors.length)],
      alpha:Math.random()*0.6+0.1,
      twinkleSpeed:Math.random()*0.015
    });
  }
}
function animate(){
  ctx.clearRect(0,0,width,height);
  for(let p of particles){
    p.alpha += p.twinkleSpeed;
    if(p.alpha>0.75||p.alpha<0.1) p.twinkleSpeed=-p.twinkleSpeed;
    p.x += p.speedX; p.y += p.speedY;
    if(p.x>width)p.x=0; if(p.x<0)p.x=width;
    if(p.y>height)p.y=0; if(p.y<0)p.y=height;
    ctx.beginPath();
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.color;
    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(animate);
}
window.addEventListener('resize',()=>{resize();createParticles();});
resize(); createParticles(); animate();

/* ═══════════════════════════════════════════════════════════════
   留言板数据与交互
   ═══════════════════════════════════════════════════════════════ */

// 后端 API（Cloudflare Pages Function，同域代理 GitHub Issues）
const API = '/api/feedback';
const GH_ISSUES_URL = 'https://github.com/Wang-738B/xylx/issues'; // 兜底：GitHub 提交入口
const PAGE_SIZE = 4;
const FETCH_TIMEOUT = 10000;        // 请求超时（毫秒），避免线路差时无限挂起

let allMessages = [];    // 已加载的反馈
let displayedCount = 0;  // 已渲染条数（用于动画下标）
let nextCursor = 1;      // 分页页码（GitHub Issues 按页）
let hasMore = true;      // 是否还有更多
let isLoading = false;   // 防止重复请求

// 带超时的 fetch：网络不稳定时避免页面一直转圈
async function fetchWithTimeout(url, options = {}){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), FETCH_TIMEOUT);
  try{
    return await fetch(url, {...options, signal: controller.signal});
  }finally{
    clearTimeout(timer);
  }
}

// 服务不可用提示：明确告知，并提供 GitHub 兜底入口（不再静默降级本地模式）
function showServiceNotice(){
  const notice = document.getElementById('modeNotice');
  if(!notice) return;
  notice.innerHTML = '⚠ 反馈服务暂不可用，请稍后重试，或前往 <a href="' + GH_ISSUES_URL + '" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">GitHub 提交</a>';
  notice.style.display = '';
}

// 头像颜色渐变
const avatarGradients = [
  ['#b39862','#946c22'],
  ['#c9a96e','#a67c3a'],
  ['#d4a574','#b8864a'],
  ['#a89060','#8a7040'],
  ['#c4a06a','#a07c40']
];

function getAvatarColor(name){
  let hash = 0;
  for(let i=0;i<name.length;i++) hash = name.charCodeAt(i) + ((hash<<5)-hash);
  return avatarGradients[Math.abs(hash)%avatarGradients.length];
}

function getInitial(name){
  return name.charAt(0).toUpperCase();
}

function formatTime(date){
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,'0');
  const d = String(date.getDate()).padStart(2,'0');
  const h = String(date.getHours()).padStart(2,'0');
  const min = String(date.getMinutes()).padStart(2,'0');
  return `${y}-${m}-${d} ${h}:${min}`;
}

function parseServerTime(str){
  // GitHub created_at 为 ISO 串 "YYYY-MM-DDTHH:MM:SSZ"
  const s = String(str).trim();
  if(s.includes('T')) return new Date(s);
  return new Date(s.replace(' ', 'T') + (s.endsWith('Z') ? '' : 'Z'));
}

const TYPE_TEXT = { '建议':'建议', '问题':'问题', '咨询':'咨询' };

function renderMessage(msg, index){
  const [c1,c2] = getAvatarColor(msg.name);
  const card = document.createElement('div');
  card.className = 'message-card';
  card.style.animationDelay = `${index*0.06}s`;
  const type = TYPE_TEXT[msg.type] || '建议';
  const stateBadge = msg.state === 'closed'
    ? '<span class="state-badge state-closed">已处理</span>'
    : '<span class="state-badge state-open">处理中</span>';
  card.innerHTML = `
    <div class="msg-header">
      <div class="msg-avatar" style="background:linear-gradient(135deg,${c1},${c2})">${getInitial(msg.name)}</div>
      <div class="msg-meta">
        <div class="msg-name">${escapeHtml(msg.name)}
          <span class="type-badge">${escapeHtml(type)}</span>${stateBadge}
        </div>
        <div class="msg-time">
          <svg viewBox="0 0 256 256" fill="currentColor"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm64-88a8,8,0,0,1-8,8H128a8,8,0,0,1-8-8V72a8,8,0,0,1,16,0v48h48A8,8,0,0,1,192,128Z"/></svg>
          ${formatTime(parseServerTime(msg.time))}
        </div>
      </div>
    </div>
    <div class="msg-content">${escapeHtml(msg.content).replace(/\n/g,'<br>')}</div>
  `;
  return card;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function loadMore(){
  const list = document.getElementById('messageList');
  const btn = document.getElementById('loadMoreBtn');
  const wrap = document.getElementById('loadMoreWrap');
  const noMore = document.getElementById('noMore');

  if(isLoading) return;
  if(!hasMore){
    btn.style.display = 'none';
    noMore.style.display = '';
    return;
  }

  isLoading = true;
  btn.classList.add('loading');
  btn.disabled = true;

  try{
    const res = await fetchWithTimeout(`${API}?cursor=${nextCursor}&pageSize=${PAGE_SIZE}`);
    if(!res.ok) throw new Error('加载失败');
    const data = await res.json();

    const startIndex = displayedCount;
    data.messages.forEach((msg, i)=>{
      allMessages.push(msg);
      list.appendChild(renderMessage(msg, startIndex + i));
    });
    displayedCount = allMessages.length;
    nextCursor = data.nextCursor ?? nextCursor;
    hasMore = data.hasMore;
    document.getElementById('totalCount').textContent = data.total ?? displayedCount;

    if(displayedCount === 0){
      // 空状态：还没有任何反馈
      list.innerHTML = `
        <div class="empty-state">
          <svg viewBox="0 0 256 256" fill="currentColor"><path d="M128,24A104,104,0,0,0,36.18,176.88L24.83,210.93a16,16,0,0,0,20.24,20.24l34.05-11.35A104,104,0,1,0,128,24Zm0,192a87.87,87.87,0,0,1-44.06-11.81,8,8,0,0,0-6.54-.67L40,216,52.47,178.6a8,8,0,0,0-.66-6.54A88,88,0,1,1,128,216Z"/></svg>
          <p>还没有反馈，来做第一位访客吧 ✦</p>
        </div>`;
      wrap.style.display = 'none';
      return;
    }

    wrap.style.display = '';
    if(!hasMore){
      btn.style.display = 'none';
      noMore.style.display = '';
    }
  }catch(err){
    // 服务不可用：明确提示 + GitHub 兜底入口（不再静默降级）
    showServiceNotice();
    showToast('反馈服务暂不可用，请稍后重试');
  }finally{
    isLoading = false;
    btn.classList.remove('loading');
    btn.disabled = false;
  }
}

// 字数统计
const messageInput = document.getElementById('message');
const charCount = document.getElementById('charCount');
messageInput.addEventListener('input',()=>{
  const len = messageInput.value.length;
  charCount.textContent = `${len} / 500`;
  charCount.classList.toggle('over', len > 500);
});

// 把一条反馈插到列表顶部（提交成功后统一调用）
function prependMessage(newMsg){
  allMessages.unshift(newMsg);
  displayedCount++;
  hasMore = true; // 顶部有了新反馈，允许继续往下加载

  // 插入到列表顶部（先移除空状态）
  const list = document.getElementById('messageList');
  const empty = list.querySelector('.empty-state');
  if(empty) empty.remove();

  const wrap = document.getElementById('loadMoreWrap');
  const noMore = document.getElementById('noMore');
  const loadBtn = document.getElementById('loadMoreBtn');
  wrap.style.display = '';
  loadBtn.style.display = '';
  noMore.style.display = 'none';

  const card = renderMessage(newMsg, 0);
  card.style.animationDelay = '0s';
  list.insertBefore(card, list.firstChild);

  const totalEl = document.getElementById('totalCount');
  totalEl.textContent = Number(totalEl.textContent) + 1;

  // 重置表单
  document.getElementById('nickname').value = '';
  document.getElementById('fbType').value = 'suggestion';
  messageInput.value = '';
  charCount.textContent = '0 / 500';

  showToast('反馈已提交，感谢你的支持 ✦');

  // 平滑滚动到新反馈
  card.scrollIntoView({behavior:'smooth', block:'center'});
}

// 表单提交
document.getElementById('messageForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const nickname = document.getElementById('nickname').value.trim();
  const message = messageInput.value.trim();
  const type = document.getElementById('fbType').value;
  const btn = document.getElementById('submitBtn');

  if(!nickname){
    showToast('请填写昵称');
    document.getElementById('nickname').focus();
    return;
  }
  if(!message){
    showToast('请填写反馈内容');
    messageInput.focus();
    return;
  }

  // 提交中状态
  btn.classList.add('loading');
  btn.disabled = true;
  btn.querySelector('svg').innerHTML = '<circle cx="128" cy="128" r="96" fill="none" stroke="currentColor" stroke-width="16" stroke-dasharray="400" stroke-dashoffset="200"/>';

  let newMsg = null;
  try{
    const res = await fetchWithTimeout(API, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ type, name:nickname, content:message, hp:document.getElementById('hp').value })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || '发送失败，请稍后重试');
    if(!data.message) return; // 蜜罐拦截：爬虫提交被忽略，静默当作成功

    newMsg = data.message;
    prependMessage(newMsg);
  }catch(err){
    // 后端不可用：明确提示 + GitHub 兜底入口（不再静默降级本地）
    showServiceNotice();
    showToast(err.message || '发送失败，请稍后重试');
  }finally{
    // 恢复按钮
    btn.classList.remove('loading');
    btn.disabled = false;
    btn.querySelector('svg').innerHTML = '<path d="M237.9,200.1,141.85,32.18a16,16,0,0,0-27.89,0l-95.89,168a16,16,0,0,0,19.26,22.92L128,192.45l90.67,30.63A16.22,16.22,0,0,0,224,224a16,16,0,0,0,13.86-23.9Zm-14.05,7.84L136,178.26V120a8,8,0,0,0-16,0v58.26L32.16,207.94,32,208,127.86,40,224,208Z"/>';
  }
});

// Toast 提示
let toastTimer;
function showToast(msg){
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toast.classList.remove('show'), 2500);
}

// 加载更多按钮
document.getElementById('loadMoreBtn').addEventListener('click', loadMore);

// 初始加载
loadMore();
</script>

</body>
