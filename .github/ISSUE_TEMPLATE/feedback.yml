name: 建议反馈
description: 提交一条建议、问题或咨询（通常由网站建议反馈页自动创建）
title: "[建议] "
labels: ["建议", "feedback"]
body:
  - type: markdown
    attributes:
      value: |
        ## 谢谢你的反馈 ✦
        请尽量描述清楚，方便站长快速定位和处理。
  - type: dropdown
    id: type
    attributes:
      label: 反馈类型
      options:
        - 建议
        - 问题
        - 咨询
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: 昵称
      placeholder: 怎么称呼你？
    validations:
      required: true
  - type: textarea
    id: content
    attributes:
      label: 反馈内容
      placeholder: 想说点什么？
    validations:
      required: true
